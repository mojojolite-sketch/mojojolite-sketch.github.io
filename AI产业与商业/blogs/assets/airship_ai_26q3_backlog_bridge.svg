<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1120" height="560" rx="14" fill="url(#bg5)"/>
  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">Airship AI (NASDAQ: AISP) · 2026Q3 财报穿透、$29.0M DHS 合同与 $30.6M Backlog 兑现桥接</text>
  <text x="36" y="66" fill="#94a3b8" font-size="13">SEC Form 10-Q / 10-K 及官方公告交叉对账 · 区分「软硬件捆绑交付确认」与「非现金公允价值变动 (Warrant / Earnout)」</text>

  <!-- Left Column: Quarterly Revenue & Margin Trajectory -->
  <rect x="36" y="90" width="340" height="430" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="54" y="120" fill="#38bdf8" font-size="15" font-weight="700">1. 季度营收与毛利率轨迹 (2025Q1–2026Q3)</text>

  <text x="54" y="148" fill="#cbd5e1" font-size="12" font-weight="600">单季合并净营收 (Net Revenues, $M)</text>
  <rect x="54" y="160" width="165" height="20" rx="3" fill="#475569"/>
  <text x="60" y="174" fill="#f8fafc" font-size="11">2025Q1: $5.50M</text>
  <rect x="54" y="186" width="65" height="20" rx="3" fill="#475569"/>
  <text x="126" y="200" fill="#cbd5e1" font-size="11">2025Q2: $2.15M</text>
  <rect x="54" y="212" width="36" height="20" rx="3" fill="#ef4444"/>
  <text x="98" y="226" fill="#fca5a5" font-size="11">2025Q3: $1.18M (联邦采购延迟低谷)</text>
  <rect x="54" y="238" width="195" height="20" rx="3" fill="#475569"/>
  <text x="60" y="252" fill="#f8fafc" font-size="11">2025Q4: $6.49M (全年 $15.32M)</text>
  <rect x="54" y="264" width="191" height="20" rx="3" fill="#0284c7"/>
  <text x="60" y="278" fill="#f8fafc" font-size="11">2026Q1: $6.35M</text>
  <rect x="54" y="290" width="124" height="20" rx="3" fill="#0284c7"/>
  <text x="60" y="304" fill="#f8fafc" font-size="11">2026Q2: $4.12M (GM 75.0%)</text>
  <rect x="54" y="316" width="187" height="22" rx="3" fill="#10b981"/>
  <text x="60" y="331" fill="#052e16" font-size="11" font-weight="700">2026Q3: $6.23M (+429% YoY, GM 56.2%)</text>

  <rect x="54" y="352" width="304" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="68" y="374" fill="#fbbf24" font-size="12.5" font-weight="600">9M 2026 累计财务成色对账</text>
  <text x="68" y="396" fill="#cbd5e1" font-size="11.5">• 前三季累计营收：$16.71M (已超 FY25 全年 $15.32M)</text>
  <text x="68" y="416" fill="#cbd5e1" font-size="11.5">• 季末现金及等价物：$12.74M (较 Q2 末 $12.37M 回升)</text>
  <text x="68" y="436" fill="#cbd5e1" font-size="11.5">• 毛利率波动原因：Q2 (75.0%) 含高比例软件维护；</text>
  <text x="68" y="454" fill="#cbd5e1" font-size="11.5">  Q3 (56.2%) 因 Outpost AI 边缘硬件与 Turnkey 交付</text>
  <text x="68" y="472" fill="#cbd5e1" font-size="11.5">  占比上升，回归软硬件捆绑常态区间 (50%~60%)。</text>

  <!-- Middle Column: Backlog Bridge & DHS Award -->
  <rect x="402" y="90" width="356" height="430" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="420" y="120" fill="#10b981" font-size="15" font-weight="700">2. 在手订单跃迁桥接 ($3.3M → $30.6M)</text>

  <rect x="420" y="140" width="320" height="72" rx="8" fill="#0f172a" stroke="#64748b"/>
  <text x="434" y="164" fill="#e2e8f0" font-size="13" font-weight="600">历史 Backlog 基线 (2025/12/31 – 2026/06/30)</text>
  <text x="434" y="186" fill="#94a3b8" font-size="12">• 2025 年末：$3.3M → 2026Q2 末：$6.9M (Q3 已大部分出货确认)</text>
  <text x="434" y="204" fill="#94a3b8" font-size="12">• 递延服务 RPO：$8.9M (PCS 维护合同，平均履约期 ~4 年)</text>

  <rect x="420" y="226" width="320" height="132" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="434" y="250" fill="#6ee7b7" font-size="13" font-weight="600">核心增量催化：联邦财年末 (9/30) 集中授标</text>
  <text x="434" y="272" fill="#cbd5e1" font-size="12">① $29.0M DHS 固定总价合同 (Firm-Fixed-Price)</text>
  <text x="434" y="292" fill="#94a3b8" font-size="11.5">   • Brand-Name-Only 单一品牌指定采购，6 个月履约期</text>
  <text x="434" y="310" fill="#94a3b8" font-size="11.5">   • 覆盖 Acropolis 平台 + Outpost AI 边缘盒 + Fortress AI</text>
  <text x="434" y="330" fill="#cbd5e1" font-size="12">② $1.7M 增量高毛利软件与边缘扩展订单 (Q3 获授)</text>
  <text x="434" y="348" fill="#34d399" font-size="11.5">   • 合计推动 2026/09/30 核验 Backlog 达创纪录 $30.6M</text>

  <rect x="420" y="372" width="320" height="130" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="434" y="396" fill="#7dd3fc" font-size="13" font-weight="600">收入确认节奏 (2026Q4 – 2027Q1 兑现窗口)</text>
  <text x="434" y="418" fill="#cbd5e1" font-size="12">• 其中 $28.3M 确定性订单排期于 2026Q4 与 2027Q1 交付</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">• 按 6 个月履约期测算，单季潜在营收体量跃升至 $14M–$18M</text>
  <text x="434" y="458" fill="#94a3b8" font-size="11.5">• 验证管线 (Validated Pipeline)：超 $200M ($206.1M)</text>
  <text x="434" y="478" fill="#94a3b8" font-size="11.5">• 新产品催化：Ask Airship 自然语言 Agentic AI 年底发布</text>

  <!-- Right Column: Audit & Risk Checks -->
  <rect x="784" y="90" width="300" height="430" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="802" y="120" fill="#f59e0b" font-size="15" font-weight="700">3. 本工作台 10-K/10-Q 穿透复核</text>

  <rect x="802" y="140" width="264" height="362" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="814" y="164" fill="#34d399" font-size="12" font-weight="600">✅ 闭合未决问题 (aisp-q-backlog-execution)</text>
  <text x="814" y="184" fill="#cbd5e1" font-size="11">   Q2 末 $6.9M backlog 已在 Q3 顺畅转化为</text>
  <text x="814" y="201" fill="#cbd5e1" font-size="11">   $6.23M 收入，且新获 $29.0M DHS FFP 合同</text>
  <text x="814" y="218" fill="#cbd5e1" font-size="11">   锁定未来两季主业兑现底盘。</text>

  <text x="814" y="246" fill="#fbbf24" font-size="12" font-weight="600">⚠️ 429% YoY 增速的低基数效应核查</text>
  <text x="814" y="266" fill="#cbd5e1" font-size="11">   2025Q3 营收仅 $1.18M 系联邦预算冻结异</text>
  <text x="814" y="283" fill="#cbd5e1" font-size="11">   常低谷；若对比 2026Q1 ($6.35M) 或 2025Q4</text>
  <text x="814" y="300" fill="#cbd5e1" font-size="11">   ($6.49M)，Q3 ($6.23M) 属正常高位持平，真</text>
  <text x="814" y="317" fill="#cbd5e1" font-size="11">   正的台阶式跃升将在 Q4 交付 $29M 合同后体现。</text>

  <text x="814" y="345" fill="#fbbf24" font-size="12" font-weight="600">⚠️ 客户集中度与软硬件捆绑属性</text>
  <text x="814" y="365" fill="#cbd5e1" font-size="11">   前 4-5 大客户占营收 87%–88%，且 Product</text>
  <text x="814" y="382" fill="#cbd5e1" font-size="11">   收入仍以软硬件一体机捆绑交付为主，独立纯软</text>
  <text x="814" y="399" fill="#cbd5e1" font-size="11">   件授权占比尚小，不可直接按纯 SaaS 估值。</text>

  <text x="814" y="427" fill="#f87171" font-size="12" font-weight="600">⚠️ 潜在股权稀释敞口 (Warrants)</text>
  <text x="814" y="447" fill="#cbd5e1" font-size="11">   流通普通股约 3,444 万股，但存量 2,249 万份</text>
  <text x="814" y="464" fill="#cbd5e1" font-size="11">   Warrants (加权行权价 $4.35) 构成股价上行</text>
  <text x="814" y="481" fill="#cbd5e1" font-size="11">   时的潜在稀释与 GAAP 净利润公允价值扰动。</text>

  <line x1="376" y1="300" x2="400" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="758" y1="300" x2="782" y2="300" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr5)"/>
</svg>
