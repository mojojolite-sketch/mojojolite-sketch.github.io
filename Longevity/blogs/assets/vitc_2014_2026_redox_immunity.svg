<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 473" width="960" height="473" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Helvetica Neue&#x27;, sans-serif">
  <rect x="0" y="0" width="960" height="473" rx="8" fill="#FAF7F0"/>
  <text x="34.0" y="32.0" fill="#1E563A" font-size="11" font-weight="600">DEAKIN UNIVERSITY IPAN SERIES · HEALTHY BASELINE VS METABOLIC LOAD</text>
  <text x="34.0" y="56.0" fill="#1F2421" font-size="18" font-weight="700">抗炎营养素何时有效：迪肯大学 12 年人体临床与蛋白组学边界</text>
  <text x="34.0" y="76.0" fill="#5A554C" font-size="12.2" font-weight="400">来源：PubMed 25242204 (2014) / 26774673 (2016) / 30394006 (2019) / 33472962 (2021) / 42373594 (2026)</text>
  <rect x="34.0" y="96" width="285.3" height="315" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="34.0" y="96" width="285.3" height="5" rx="2" fill="#5A554C"/>
  <text x="50.0" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">健康成年人基线 (2014, n=8)</text>
  <rect x="50.0" y="147" width="253.3" height="26" rx="4" fill="#F4F2ED" stroke="#C2BBB0" stroke-width="1"/>
  <text x="58.0" y="163.0" fill="#5A554C" font-size="11.2" font-weight="400">2x500 mg/天 x 42 天交叉对照</text>
  <text x="50.0" y="191.0" fill="#5A554C" font-size="11.2" font-weight="400">骨骼肌蓄积与转运</text>
  <text x="50.0" y="207.0" fill="#2E322F" font-size="11.8" font-weight="400">第 7 天起肌肉维 C 升至 3.9 mg/100g 湿重 (p=</text>
  <text x="50.0" y="223.0" fill="#2E322F" font-size="11.8" font-weight="400">0.001)，SVCT2 显著上升 (p=0.006)</text>
  <line x1="50.0" y1="245" x2="303.3" y2="245" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="259.0" fill="#5A554C" font-size="11.2" font-weight="400">氧化稳态与线粒体</text>
  <text x="50.0" y="275.0" fill="#2E322F" font-size="11.8" font-weight="400">肌肉基础氧化还原指标与柠檬酸合酶均无统计学</text>
  <text x="50.0" y="291.0" fill="#2E322F" font-size="11.8" font-weight="400">变化 —— 无高负荷压力时补剂不产生超额优化</text>
  <rect x="48.0" y="315" width="257.3" height="44" rx="4" fill="#F5F2EA"/>
  <text x="56.0" y="332.0" fill="#5A554C" font-size="11.2" font-weight="400">PMID 25242204：推翻「健康人多吃单方高剂量</text>
  <text x="56.0" y="347.0" fill="#5A554C" font-size="11.2" font-weight="400">抗氧化剂可无条件强化机能」误区。</text>
  <rect x="337.3" y="96" width="285.3" height="315" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="337.3" y="96" width="285.3" height="5" rx="2" fill="#1E563A"/>
  <text x="353.3" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">餐后糖脂超载窗 (2016–2019)</text>
  <rect x="353.3" y="147" width="253.3" height="26" rx="4" fill="#F2F7F4" stroke="#98BFA8" stroke-width="1"/>
  <text x="361.3" y="163.0" fill="#1E563A" font-size="11.2" font-weight="400">1000 mg/天 x 4 个月交叉 · n=7 / n=31</text>
  <text x="353.3" y="191.0" fill="#5A554C" font-size="11.2" font-weight="400">2016 高胰岛素钳夹 (n=7)</text>
  <text x="353.3" y="207.0" fill="#2E322F" font-size="11.8" font-weight="400">DCFH 自由基氧化下降 (p=0.007)，葡萄糖消耗</text>
  <text x="353.3" y="223.0" fill="#2E322F" font-size="11.8" font-weight="400">delta Rd +56.7%，外周 ISI +20.2%（Akt 与空</text>
  <text x="353.3" y="239.0" fill="#2E322F" font-size="11.8" font-weight="400">腹态未变）</text>
  <line x1="353.3" y1="261" x2="606.7" y2="261" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="353.3" y="275.0" fill="#5A554C" font-size="11.2" font-weight="400">2019 动态血糖交叉 (n=31)</text>
  <text x="353.3" y="291.0" fill="#2E322F" font-size="11.8" font-weight="400">餐后血糖 iAUC 降 36%、高血糖暴露少 2.8 小时</text>
  <text x="353.3" y="307.0" fill="#2E322F" font-size="11.8" font-weight="400">/天，收缩压降 7 mmHg、F2-异前列烷降 47</text>
  <text x="353.3" y="323.0" fill="#2E322F" font-size="11.8" font-weight="400">pg/mL</text>
  <rect x="351.3" y="347" width="257.3" height="44" rx="4" fill="#F5F2EA"/>
  <text x="359.3" y="364.0" fill="#5A554C" font-size="11.2" font-weight="400">PMID 26774673 / 30394006：纠正公众号标题</text>
  <text x="359.3" y="379.0" fill="#5A554C" font-size="11.2" font-weight="400">遗漏「原研究实为 2016 年小样本试验」。</text>
  <rect x="640.7" y="96" width="285.3" height="315" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="640.7" y="96" width="285.3" height="5" rx="2" fill="#2B4C6F"/>
  <text x="656.7" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">免疫通路闭环 (2021–2026)</text>
  <rect x="656.7" y="147" width="253.3" height="26" rx="4" fill="#F2F6FA" stroke="#9BB5CE" stroke-width="1"/>
  <text x="664.7" y="163.0" fill="#2B4C6F" font-size="11.2" font-weight="400">GRADE N=1,574 + 2026 血浆蛋白组学 n=26</text>
  <text x="656.7" y="191.0" fill="#5A554C" font-size="11.2" font-weight="400">2026 先天免疫下调 (n=26)</text>
  <text x="656.7" y="207.0" fill="#2E322F" font-size="11.8" font-weight="400">显著下调先天免疫富集通路、未折叠蛋白伴侣</text>
  <text x="656.7" y="223.0" fill="#2E322F" font-size="11.8" font-weight="400">TRAP1 及急性期炎症标志血清淀粉样蛋白 SAA1</text>
  <line x1="656.7" y1="245" x2="910.0" y2="245" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="656.7" y="259.0" fill="#5A554C" font-size="11.2" font-weight="400">2021 GRADE 荟萃 (28 项 RCT)</text>
  <text x="656.7" y="275.0" fill="#2E322F" font-size="11.8" font-weight="400">收缩压平均降 6.27 mmHg 具中等确定性；但</text>
  <text x="656.7" y="291.0" fill="#2E322F" font-size="11.8" font-weight="400">HbA1c (-0.54%) 属极低证据确定性</text>
  <rect x="654.7" y="315" width="257.3" height="44" rx="4" fill="#F5F2EA"/>
  <text x="662.7" y="332.0" fill="#5A554C" font-size="11.2" font-weight="400">PMID 42373594 / 33472962：抗炎饮食本质是</text>
  <text x="662.7" y="347.0" fill="#5A554C" font-size="11.2" font-weight="400">清理高糖脂冗余 ROS，停掉先天免疫误报警。</text>
  <text x="34.0" y="437.0" fill="#5A554C" font-size="12.2" font-weight="400">第一性原理推论：先靠饮食结构与餐后活动减少餐后血糖峰值生成过量 ROS，再用抗氧化微营养素缓冲慢性炎症人群的氧化微环境。</text>
</svg>
