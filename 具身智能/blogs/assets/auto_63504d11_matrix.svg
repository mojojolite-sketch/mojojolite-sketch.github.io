<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 638" width="960" height="638" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Helvetica Neue&#x27;, sans-serif">
  <rect x="0" y="0" width="960" height="638" rx="8" fill="#FAF7F0"/>
  <text x="34.0" y="32.0" fill="#1E563A" font-size="11" font-weight="600">CROSS-CHECK MATRIX · 具身智能</text>
  <text x="34.0" y="56.0" fill="#1F2421" font-size="18" font-weight="700">World Labs vs 字节跳动 vs 本工作台穿透定位</text>
  <text x="34.0" y="76.0" fill="#5A554C" font-size="12.2" font-weight="400">一、正面拆解追问：字节三线布局 vs World Labs（Marble / Atlas）逐维对账</text>
