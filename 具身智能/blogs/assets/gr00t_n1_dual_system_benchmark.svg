<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#142820"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#76b900"/>
    </marker>
  </defs>
  <rect width="1120" height="560" rx="14" fill="url(#bg3)"/>
  <text x="36" y="42" fill="#f8fafc" font-size="20" font-weight="700">NVIDIA Isaac GR00T N1 &amp; N1.5 (arXiv:2503.14734) · 双系统 VLA 架构与异构数据金字塔</text>
  <text x="36" y="66" fill="#94a3b8" font-size="13">NVIDIA GEAR Lab (Yuke Zhu / Jim Fan / Joel Jang) · 2.2B 参数 (Eagle-2 VLM 1.34B + Flow-Matching DiT 0.86B) 跨本体通用人形基础模型</text>

  <!-- Left Column: Data Pyramid -->
  <rect x="36" y="90" width="320" height="430" rx="10" fill="#13221c" stroke="#2d4a3e" stroke-width="1.5"/>
  <text x="54" y="120" fill="#76b900" font-size="15" font-weight="700">1. 三层异构数据金字塔 (Data Pyramid)</text>

  <!-- Pyramid Top: Real Robot -->
  <polygon points="196,142 126,222 266,222" fill="#1e3a2f" stroke="#76b900" stroke-width="1.5"/>
  <text x="152" y="192" fill="#ecfccb" font-size="11.5" font-weight="600">真机遥操作轨迹</text>
  <text x="148" y="210" fill="#a3e635" font-size="10.5">GR-1 / G1 / 双臂真机</text>

  <!-- Pyramid Mid: Synthetic Sim -->
  <polygon points="120,230 82,315 310,315 272,230" fill="#163026" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="112" y="268" fill="#e0f2fe" font-size="12" font-weight="600">仿真与神经生成轨迹 (Synthetic)</text>
  <text x="98" y="288" fill="#7dd3fc" font-size="11">DexMimicGen 轨迹倍增 + Cosmos 视频生成</text>
  <text x="110" y="305" fill="#94a3b8" font-size="10.5">780,000 条合成轨迹 (等效 6,500 小时)</text>

  <!-- Pyramid Base: Human Video -->
  <polygon points="76,323 48,410 344,410 316,323" fill="#0f221a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="86" y="358" fill="#fef3c7" font-size="12" font-weight="600">互联网与人类第一视角视频 (Egocentric)</text>
  <text x="72" y="378" fill="#fcd34d" font-size="11">Ego4D / Epic-Kitchens / 逆动力学伪动作潜变量</text>
  <text x="88" y="396" fill="#94a3b8" font-size="10.5">VQ-VAE 提取隐式动作 Token (Latent Actions)</text>

  <rect x="54" y="424" width="284" height="78" rx="8" fill="#0a1410" stroke="#2d4a3e"/>
  <text x="66" y="446" fill="#e2e8f0" font-size="12" font-weight="600">统一预训练机制 (Unified Co-Training)</text>
  <text x="66" y="466" fill="#94a3b8" font-size="11">• 无动作标签视频通过逆动力学编码器生成潜动作</text>
  <text x="66" y="484" fill="#94a3b8" font-size="11">• 跨本体 Embodiment-Specific MLP 编码器/解码器对齐</text>

  <!-- Middle Column: System 2 + System 1 -->
  <rect x="382" y="90" width="350" height="430" rx="10" fill="#13221c" stroke="#2d4a3e" stroke-width="1.5"/>
  <text x="400" y="120" fill="#38bdf8" font-size="15" font-weight="700">2. 双系统协同架构 (2.2B Total Params)</text>

  <rect x="400" y="140" width="314" height="128" rx="8" fill="#0a1410" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="414" y="164" fill="#7dd3fc" font-size="13" font-weight="600">System 2: Eagle-2 VLM 慢思考主干 (1.34B)</text>
  <text x="414" y="186" fill="#cbd5e1" font-size="12">• 视觉编码：SmolLM2 + SigLIP-2 融合多视角图像 (224×224)</text>
  <text x="414" y="206" fill="#cbd5e1" font-size="12">• 语义对齐：解析自然语言指令与场景物体空间拓扑</text>
  <text x="414" y="226" fill="#38bdf8" font-size="12">• 截取第 12 层视觉-语言特征 Token (推理频率 ~10 Hz)</text>
  <text x="414" y="246" fill="#a3e635" font-size="11.5">• N1.5 升级：冻结 VLM 视觉塔 + 引入 FLARE 未来潜表征对齐</text>

  <rect x="400" y="286" width="314" height="142" rx="8" fill="#0a1410" stroke="#76b900" stroke-width="1.5"/>
  <text x="414" y="310" fill="#a3e635" font-size="13" font-weight="600">System 1: Flow-Matching DiT 快动作专家 (0.86B)</text>
  <text x="414" y="332" fill="#cbd5e1" font-size="12">• 交叉注意力 (Cross-Attention) 注入 System 2 语义嵌入</text>
  <text x="414" y="352" fill="#cbd5e1" font-size="12">• 自注意力处理本体关节状态 q_t 与加噪动作序列 A_t^τ</text>
  <text x="414" y="372" fill="#cbd5e1" font-size="12">• 4 步欧拉积分去噪 (K=4 Denoising Steps)</text>
  <text x="414" y="392" fill="#76b900" font-size="12">• 单次前向计算仅 63.9 ms (L40 GPU)，动作块输出 50-120 Hz</text>

  <rect x="400" y="442" width="314" height="60" rx="8" fill="#0a1410" stroke="#f59e0b"/>
  <text x="414" y="464" fill="#fcd34d" font-size="12.5" font-weight="600">GR00T-WholeBodyControl 底层全身控制器</text>
  <text x="414" y="484" fill="#94a3b8" font-size="11.5">• 上肢灵巧操作轨迹 + 下肢 RL 步态平衡策略解耦闭环</text>

  <!-- Right Column: Benchmarks -->
  <rect x="758" y="90" width="326" height="430" rx="10" fill="#13221c" stroke="#2d4a3e" stroke-width="1.5"/>
  <text x="776" y="120" fill="#a3e635" font-size="15" font-weight="700">3. 仿真与 Fourier GR-1 真机评测对比</text>

  <text x="776" y="148" fill="#e2e8f0" font-size="12" font-weight="600">三大仿真基准平均成功率 (RoboCasa / DexMG / GR-1 Sim)</text>
  <rect x="776" y="158" width="125" height="18" rx="3" fill="#475569"/>
  <text x="782" y="171" fill="#f8fafc" font-size="10.5">BC-Transformer (26.4%)</text>
  <rect x="776" y="180" width="158" height="18" rx="3" fill="#64748b"/>
  <text x="782" y="193" fill="#f8fafc" font-size="10.5">Diffusion Policy (33.4%)</text>
  <rect x="776" y="202" width="215" height="20" rx="3" fill="#76b900"/>
  <text x="782" y="216" fill="#052e16" font-size="11" font-weight="700">GR00T N1-2B (45.0%, 相对提升 +34.7%)</text>

  <text x="776" y="244" fill="#e2e8f0" font-size="12" font-weight="600">Fourier GR-1 真机操作成功率 (10% 少样本 / 100% 全量)</text>
  <rect x="776" y="254" width="60" height="18" rx="3" fill="#475569"/>
  <text x="842" y="267" fill="#cbd5e1" font-size="10.5">Diffusion Policy (10% 数据): 10.2%</text>
  <rect x="776" y="276" width="145" height="18" rx="3" fill="#38bdf8"/>
  <text x="782" y="289" fill="#0f172a" font-size="10.5" font-weight="700">GR00T N1 (10% 数据): 42.6% (4.2x)</text>
  <rect x="776" y="298" width="158" height="18" rx="3" fill="#64748b"/>
  <text x="782" y="311" fill="#f8fafc" font-size="10.5">Diffusion Policy (100% 数据): 46.4%</text>
  <rect x="776" y="320" width="260" height="20" rx="3" fill="#76b900"/>
  <text x="782" y="334" fill="#052e16" font-size="11" font-weight="700">GR00T N1 (100% 数据): 76.8% (+30.4 pct)</text>

  <rect x="776" y="354" width="290" height="148" rx="8" fill="#0a1410" stroke="#2d4a3e"/>
  <text x="788" y="376" fill="#fbbf24" font-size="12.5" font-weight="600">本工作台系统核查与边界辨析</text>
  <text x="788" y="398" fill="#cbd5e1" font-size="11">✅ 63.9 ms 动作块延迟可支撑 16 步 Action Chunk</text>
  <text x="788" y="415" fill="#cbd5e1" font-size="11">   在 50Hz–100Hz 下平滑插值执行。</text>
  <text x="788" y="437" fill="#cbd5e1" font-size="11">⚠️ 合成数据边际递减：6,500 小时合成数据主要</text>
  <text x="788" y="454" fill="#cbd5e1" font-size="11">   提供动作先验，零真机微调时直接迁移率仍受</text>
  <text x="788" y="471" fill="#cbd5e1" font-size="11">   接触物理建模误差制约。</text>

  <line x1="356" y1="300" x2="380" y2="300" stroke="#76b900" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="732" y1="300" x2="756" y2="300" stroke="#76b900" stroke-width="2" marker-end="url(#arr3)"/>
</svg>
