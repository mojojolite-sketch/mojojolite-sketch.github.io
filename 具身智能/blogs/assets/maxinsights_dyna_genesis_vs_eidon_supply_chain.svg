<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="bg_mx2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="100%" stop-color="#142234"/>
    </linearGradient>
    <marker id="arr_c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr_w2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1220" height="680" rx="14" fill="url(#bg_mx2)"/>
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">Maxinsights 具身数据供应链穿透：Dyna-2 与 Genesis AI (GENE-26.5) 底座咬合、主体消歧及 Eidon AI 正反对账</text>
  <text x="32" y="61" fill="#94a3b8" font-size="12.2">硅谷 Santa Clara / 中国海宇数维 · $30M 种子轮 (Peak XV 领投) · CEO 袁宇光 (前 Eaton / Mega Gear) &amp; CTO 汪堃 (前 Google X/Waymo / 轻舟智航联创)</text>

  <!-- Top Left: Maxinsights Supply Engine -->
  <rect x="30" y="80" width="352" height="310" rx="10" fill="#101f33" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="46" y="106" fill="#38bdf8" font-size="14" font-weight="700">上游底座 · Maxinsights 工业化数采产线</text>
  <text x="46" y="126" fill="#cbd5e1" font-size="10.4">• 全球网络: 美/墨/土/中/泰/越/印尼/南非 8 国 (+巴西扩建)</text>
  <text x="46" y="143" fill="#cbd5e1" font-size="10.4">• 现场规模: 3,500–5,000+ 签约采集员 · 50,000+ 真实工位/家庭</text>
  <text x="46" y="160" fill="#6ee7b7" font-size="10.4" font-weight="600">• 累计产能: 已采 &gt;200万h → 150万h 模型就绪 (月产 45万h)</text>
  <text x="46" y="177" fill="#cbd5e1" font-size="10.4">• 商业兑现: 服务 30+ 机器人团队，8 份长期经常性复购合同</text>

  <rect x="46" y="192" width="320" height="58" rx="6" fill="#0b1626" stroke="#243b5a"/>
  <text x="56" y="210" fill="#7dd3fc" font-size="10.8" font-weight="700">① MaxSLAM 空间轨迹引擎 (硬同步双目 + VIO)</text>
  <text x="56" y="227" fill="#cbd5e1" font-size="9.8">ATE 4.24mm / 0.57° / 99.90% 帧完整率 (较 Basalt 降错 94.7%)</text>
  <text x="56" y="242" fill="#94a3b8" font-size="9.6">解耦相机晃动与物体运动，支撑跨帧 3D 关节与场景几何重建</text>

  <rect x="46" y="256" width="320" height="58" rx="6" fill="#0b1626" stroke="#243b5a"/>
  <text x="56" y="274" fill="#fcd34d" font-size="10.8" font-weight="700">② MaxLoop 实时 AI 质检 + ③ MaxGlove 触觉力手套</text>
  <text x="56" y="291" fill="#cbd5e1" font-size="9.8">• MaxLoop: 当日反馈 (vs 1–2周)，减 90% 质检人力 / 降 80% 成本</text>
  <text x="56" y="306" fill="#fbcfe8" font-size="9.8">• MaxGlove: 免繁琐标定 (破除竞品日采10–20min瓶颈)，27年冲100万h</text>

  <text x="46" y="334" fill="#94a3b8" font-size="9.8">9 大标注模态: 环境/任务/子任务/指令 + SLAM位姿/手部关键点/</text>
  <text x="46" y="349" fill="#94a3b8" font-size="9.8">3D场景重建/接触物理/运动学轨迹 → 按客户指定本体结构直接交付</text>
  <text x="46" y="372" fill="#6ee7b7" font-size="10" font-weight="600">✅ 融资锚点: 2026-10 官宣 $30M Seed (Peak XV, Tola, SPC, 渶策)</text>

  <!-- Supply Arrows -->
  <line x1="384" y1="168" x2="424" y2="152" stroke="#34d399" stroke-width="2.2" marker-end="url(#arr_c2)"/>
  <line x1="384" y1="268" x2="424" y2="286" stroke="#34d399" stroke-width="2.2" marker-end="url(#arr_c2)"/>

  <!-- Top Center: Verified Customer 1 (Dyna) & Verified Customer 2 (Genesis AI GENE-26.5) -->
  <!-- Box A: Dyna Robotics -->
  <rect x="428" y="80" width="438" height="142" rx="10" fill="#102925" stroke="#34d399" stroke-width="1.6"/>
  <text x="444" y="104" fill="#6ee7b7" font-size="13.5" font-weight="700">✅ 官方实锤客户 A · Dyna Robotics (Axis I 百万小时代表)</text>
  <text x="444" y="123" fill="#e2e8f0" font-size="10.4">• 供应关系: Maxinsights 官宣为 Dyna-2 背后最大人类第一视角数据供应商</text>
  <text x="444" y="140" fill="#cbd5e1" font-size="10.2">• 缩放实证: 1K → 10K → 100K → 1M 小时四数量级单调增益 (10K–100K 拐点)</text>
  <text x="444" y="157" fill="#cbd5e1" font-size="10.2">• 关键消融: 仅靠 3D 手部伪动作不产生跨本体缩放；联合未来视频预测 (WAM) 才破局</text>
  <text x="444" y="174" fill="#a7f3d0" font-size="10.2">• 商业闭环: 每任务仅 ≤10h 真机后训练 (39任务成功率 20%→53%)，驱动 Dyna-2.1 + Taku</text>
  <text x="444" y="191" fill="#a7f3d0" font-size="10.2">  跑通 1小时一镜到底商用洗衣房全流程 &amp; 连续 24h 叠 850+ 餐巾 (良率 99.4%)</text>
  <text x="444" y="209" fill="#94a3b8" font-size="9.6">联创 Lindon Gao / York Yang / Jason Ma (前 DeepMind) · $120M A轮 ($600M 估值)</text>

  <!-- Box B: Genesis AI (GENE-26.5) -->
  <rect x="428" y="234" width="438" height="156" rx="10" fill="#132a36" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="444" y="258" fill="#7dd3fc" font-size="13.5" font-weight="700">✅ 官方实锤客户 B · Genesis AI / GENE-26.5 (用户所指 "genie/GENE")</text>
  <text x="444" y="277" fill="#e2e8f0" font-size="10.4">• 供应与共研: 交付 200,000 小时第一视角数据 + 联合实测 MaxGlove 触觉力手套</text>
  <text x="444" y="294" fill="#fde68a" font-size="10.2" font-weight="600">• GENE 三源混合数据金字塔 (不单押一源，同时张成 Breadth × Depth):</text>
  <text x="454" y="311" fill="#cbd5e1" font-size="10">① 第三视角视频 (Breadth 广度) + ② 20万h 第一视角 (Natural Interaction 自然交互)</text>
  <text x="454" y="327" fill="#cbd5e1" font-size="10">③ 1:1:1 电子皮肤传感手套 (High-Fidelity Hand Motion &amp; Tactile 映射灵巧手)</text>
  <text x="444" y="344" fill="#a7f3d0" font-size="10.2">• 五大操作评估轴: 空间精度 · 时序编排 · 接触丰富度 · 接触协同 · 工具媒介交互</text>
  <text x="444" y="361" fill="#6ee7b7" font-size="10.2" font-weight="600">• 下游商业回报: 高密度人类经验抵消昂贵真机数采，多项复杂技能 &lt;1h 真机数据即自主</text>
  <text x="444" y="378" fill="#94a3b8" font-size="9.6">CMU 博士周宪 (Zhou Xian) &amp; Théophile Gervet (前 Skild/Mistral) · $105M Seed (Khosla/Eclipse)</text>

  <!-- Top Right: Entity Disambiguation Box -->
  <rect x="882" y="80" width="308" height="310" rx="10" fill="#1e1b2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="898" y="106" fill="#fcd34d" font-size="13.5" font-weight="700">⚠️ 主体精准消歧："Genie" vs "GENE"</text>
  <text x="898" y="128" fill="#6ee7b7" font-size="10.6" font-weight="700">1. 本文主角：Genesis AI · GENE-26.5 (✅ 已核实)</text>
  <text x="898" y="146" fill="#cbd5e1" font-size="9.9">• 官网 genesis.ai (硅谷+巴黎)，口语常读作 Genie</text>
  <text x="898" y="162" fill="#cbd5e1" font-size="9.9">• 《Beyond 1M Hours》第2节与 $30M 融资通稿双</text>
  <text x="898" y="178" fill="#cbd5e1" font-size="9.9">  重实锤：采购 Maxinsights 20万小时数据并共研</text>
  <text x="898" y="194" fill="#cbd5e1" font-size="9.9">  MaxGlove，单手磕蛋/切菜/移液管/拧魔方全栈模型</text>

  <line x1="898" y1="210" x2="1174" y2="210" stroke="#334155" stroke-dasharray="4 3"/>

  <text x="898" y="232" fill="#fbbf24" font-size="10.6" font-weight="700">2. 同音易混：智元机器人 AgiBot Genie (⚠️ 区分)</text>
  <text x="898" y="250" fill="#cbd5e1" font-size="9.9">• 智元旗下灵犀/远征/精灵 Genie-1 与 Genie Studio</text>
  <text x="898" y="266" fill="#cbd5e1" font-size="9.9">• 核心底座 AgiBot World 主打上海临港自建数采厂</text>
  <text x="898" y="282" fill="#cbd5e1" font-size="9.9">  百台同构双臂真机遥操作 (100万条真机轨迹)</text>
  <text x="898" y="298" fill="#94a3b8" font-size="9.8">• 证据边界：公开披露中未见智元官宣采购海宇数维；</text>
  <text x="898" y="314" fill="#94a3b8" font-size="9.8">  若产业端另存外采人手视频线索，单列为待核实缺口</text>

  <rect x="898" y="330" width="276" height="46" rx="6" fill="#12101d" stroke="#4c1d95"/>
  <text x="908" y="348" fill="#ddd6fe" font-size="9.8" font-weight="600">横评通研院/Sharpa UVTA &amp; 宇树 Dex5-S:</text>
  <text x="908" y="364" fill="#cbd5e1" font-size="9.5">GENE 1:1:1 电子皮肤手套与 UVTA 同解“接触力缺失”痛点</text>

  <!-- Bottom Half: Head-to-Head Counter-Check Eidon AI vs Maxinsights vs Shared Endgame Wall -->
  <rect x="30" y="406" width="1160" height="252" rx="10" fill="#0f1826" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="432" fill="#f8fafc" font-size="14.5" font-weight="700">具身数采商业模式正反对账：为什么 Eidon AI 停摆清盘，Maxinsights 却狂揽 $30M？终局“内置消亡期”解除没有？</text>

  <!-- Left Card: Eidon AI Post-Mortem -->
  <rect x="48" y="448" width="358" height="192" rx="8" fill="#231419" stroke="#ef4444" stroke-width="1.4"/>
  <text x="62" y="470" fill="#fca5a5" font-size="12.5" font-weight="700">❌ 反方证伪：Eidon AI 停摆复盘 ($3.5M Seed)</text>
  <text x="62" y="488" fill="#fecaca" font-size="10">Sam Padilla《Robotics Data is a Broken Business》</text>
  <text x="62" y="508" fill="#cbd5e1" font-size="10">• 模式: C端去中心化众包寄送相机 + 7点上肢 IMU 套件</text>
  <text x="62" y="525" fill="#cbd5e1" font-size="10">• 产出: 运营2年仅攒下 1,270+ 小时 (CC-BY-4.0 清盘开源)</text>
  <text x="62" y="542" fill="#fca5a5" font-size="10">• 死因 ① 运营与良率崩盘: 跨国寄送硬件折损、家庭无纹理</text>
  <text x="62" y="558" fill="#fca5a5" font-size="10">  墙面漂移、缺毫米级相机位姿与指尖力，人工洗片吞噬毛利</text>
  <text x="62" y="575" fill="#fca5a5" font-size="10">• 死因 ② 规格碎片化: 各实验室 URDF/传感器要求互不兼容</text>
  <text x="62" y="592" fill="#fca5a5" font-size="10">• 死因 ③ 买家池仅 ~20 家 + 车队起量后踢开外包商</text>
  <text x="62" y="612" fill="#94a3b8" font-size="9.6">结论：靠散户众包卖“廉价录制小时数”在物理与经济上双破产</text>

  <!-- Middle Card: Maxinsights Industrial Breakthrough -->
  <rect x="424" y="448" width="372" height="192" rx="8" fill="#102822" stroke="#34d399" stroke-width="1.5"/>
  <text x="438" y="470" fill="#6ee7b7" font-size="12.5" font-weight="700">✅ 正方破局：Maxinsights 工业化制造套利 ($30M)</text>
  <text x="438" y="488" fill="#a7f3d0" font-size="10">把具身数据当精密制造业管良率 (Yield = 96%) 而非搞 Web3 众包</text>
  <text x="438" y="508" fill="#e2e8f0" font-size="10">• 破死因 ① (重运营与漂移): 新兴市场 8 国集中管控劳务套利 +</text>
  <text x="438" y="525" fill="#e2e8f0" font-size="10">  自研硬同步双目 MaxSLAM (4.24mm) + MaxLoop 砍 80% 质检费</text>
  <text x="438" y="542" fill="#e2e8f0" font-size="10">• 破死因 ② (规格割裂): 底层采集保留 S_t 多模态真值，上层</text>
  <text x="438" y="558" fill="#e2e8f0" font-size="10">  按客户本体重定向定制交付 (拿下 30+ 客户、8 份长约)</text>
  <text x="438" y="575" fill="#6ee7b7" font-size="10">• 踩准 2025–2027 WAM 冷启动黄金窗口: 真机车队尚未铺开，</text>
  <text x="438" y="592" fill="#6ee7b7" font-size="10">  Dyna-2 与 GENE-26.5 急需百万小时高良率人类先验破冷启动</text>
  <text x="438" y="612" fill="#a7f3d0" font-size="9.6">结论：工业化 SOP 良率 + 传感器深度吃下冷启动期最大铲子红利</text>

  <!-- Right Card: Shared Terminal Risk & Strategic Escape -->
  <rect x="814" y="448" width="358" height="192" rx="8" fill="#261f12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="828" y="470" fill="#fcd34d" font-size="12.5" font-weight="700">⚠️ 共同终局铁墙：3–5 年“逃离卖数据竞赛”</text>
  <text x="828" y="488" fill="#fde68a" font-size="10">PitchBook (2026-11-09): "A race to get out of the data business"</text>
  <text x="828" y="508" fill="#cbd5e1" font-size="10">• Eidon 死因 ③ 并未消失: 全球付得起百万美元年框的头部</text>
  <text x="828" y="525" fill="#cbd5e1" font-size="10">  具身买家仍仅 20–30 家 (8 份长约意味着高客户集中度)</text>
  <text x="828" y="542" fill="#cbd5e1" font-size="10">• 双侧替代夹击: ① Generalist/π/Dyna 商用车队回流同分布</text>
  <text x="828" y="558" fill="#cbd5e1" font-size="10">  失败恢复数据；② 光轮 Newton + FLORA 合成仿真压低成本</text>
  <text x="828" y="575" fill="#fcd34d" font-size="10" font-weight="600">• Maxinsights 的自救后手: 官网明确声明终局转向“真实世界</text>
  <text x="828" y="592" fill="#fcd34d" font-size="10" font-weight="600">  模型评测 (Evaluation)、仿真耦合与现场部署 (Deployment)”</text>
  <text x="828" y="612" fill="#fde68a" font-size="9.6">本工作台裁决：冷启动赢家已现，但估值能否跃迁看下游评测/部署转化</text>
</svg>
