  <!-- Header -->
  <text x="28" y="36" font-size="19" font-weight="700" fill="#26231e">阿尔伯塔 2 × 300 kW 车用改装燃气机组（12L 直列六缸重卡平台）395 天运行实证（2025.10–2026.10）</text>
  <text x="28" y="58" font-size="12.5" fill="#6b6257">Unit: kWh / kW / CAD / Hours · 累计 9,480 日历小时 · 合计发电 837,849 kWh · 日历均出力 88.4 kW · 名义容量系数 CF 仅 14.7%</text>

  <!-- ==================== PANEL 1 (TOP LEFT): 13-MONTH GENERATION & TEMPERATURE ==================== -->
  <rect x="24" y="74" width="608" height="325" rx="8" fill="#fbf9f3" stroke="#d5ccb8" stroke-width="1.3"/>
  <text x="40" y="100" font-size="14.5" font-weight="700" fill="#26231e">① 13 个月逐月日历平均出力（kW）与卡尔加里极端气温（ECCC CALGARY INTL A）</text>
  <text x="40" y="118" font-size="11.5" fill="#6b6257">双机额定 600 kW，实际单机连续带载上限 160–170 kW（双机上限 340 kW = 57%）；最优月 159.9 kW</text>

