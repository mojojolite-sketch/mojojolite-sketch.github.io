  <text x="1059" y="344" font-size="11.5" font-weight="700" fill="#26231e">$0.0994/kWh (13.56 ¢ · 100%)</text>

  <rect x="664" y="356" width="574" height="36" rx="5" fill="#fff8eb" stroke="#d97706" stroke-width="1"/>
  <text x="674" y="378" font-size="11" font-weight="700" fill="#8b3a2b">2024–2025 减产期现金成本曾飙至 $0.0874–$0.0973/kWh；综合成本较 $0.063 售电价倒挂 $0.0364/kWh</text>

  <!-- ==================== PANEL 3 (BOTTOM LEFT): GAS QUALITY (GPA 2145) & CR MISMATCH ==================== -->
  <rect x="24" y="420" width="608" height="336" rx="8" fill="#fbf9f3" stroke="#d5ccb8" stroke-width="1.3"/>
  <text x="40" y="446" font-size="14.5" font-weight="700" fill="#26231e">③ 气源重烃劣化（GPA 2145）与高低压缩比机型（9.7:1 vs 11.3:1）实证</text>
  <text x="40" y="464" font-size="11.5" fill="#6b6257">2024年 C2+ 暴增至 21.2%、NPL 甲烷数跌至 40.2，4 台 11.3:1 机组高频爆震并降额 30%</text>

  <line x1="40" y1="476" x2="614" y2="476" stroke="#dfd7c6" stroke-width="1"/>
  <text x="44" y="494" font-size="11" font-weight="700" fill="#5c5346">化验与运行指标</text>
  <text x="230" y="494" font-size="11" font-weight="700" fill="#2d5a40">21–22 设计基准</text>
  <text x="355" y="494" font-size="11" font-weight="700" fill="#b45309">2024.06 偏离样</text>
  <text x="480" y="494" font-size="11" font-weight="700" fill="#8b3a2b">24.08–11 极值</text>
  <line x1="40" y1="502" x2="614" y2="502" stroke="#dfd7c6" stroke-width="1"/>

  <text x="44" y="524" font-size="11" font-weight="600" fill="#26231e">甲烷 / 重烃 (C1 / C2+)</text>
  <text x="230" y="524" font-size="11" fill="#2d5a40">90.5% / 8.0%</text>
  <text x="355" y="524" font-size="11" fill="#b45309">81.2% / 16.8%</text>
  <text x="480" y="524" font-size="11" font-weight="700" fill="#8b3a2b">75.8% / 21.2%</text>

  <text x="44" y="550" font-size="11" font-weight="600" fill="#26231e">GPA 2145 理论液相当量</text>
  <text x="230" y="550" font-size="11" fill="#2d5a40">~185 mL/m³</text>
  <text x="355" y="550" font-size="11" fill="#b45309">C5+ 暴增 6–10 σ</text>
  <text x="480" y="550" font-size="11" font-weight="700" fill="#8b3a2b">363.2 (C5+ 51.1)</text>

  <text x="44" y="576" font-size="11" font-weight="600" fill="#26231e">标准 / AVL / NPL 甲烷数</text>
  <text x="230" y="576" font-size="11" fill="#2d5a40">76.5 / 74.0 / 71.5</text>
  <text x="355" y="576" font-size="11" fill="#b45309">60.2 / 54.8 / 43.5</text>
  <text x="480" y="576" font-size="11" font-weight="700" fill="#8b3a2b">55.5 / 49.1 / 40.2</text>

  <text x="44" y="602" font-size="11" font-weight="700" fill="#115e59">Gen 1 (9.7:1, MN≥60)</text>
  <text x="230" y="602" font-size="11" fill="#2d5a40">满负荷平稳</text>
  <text x="355" y="602" font-size="11" fill="#115e59">偶发微调平稳</text>
  <text x="480" y="602" font-size="11" font-weight="700" fill="#115e59">降额 ~12%，少爆震</text>

  <text x="44" y="628" font-size="11" font-weight="700" fill="#8b3a2b">Gen 2–5 (11.3:1, MN≥75)</text>
  <text x="230" y="628" font-size="11" fill="#26231e">偶发轻爆震</text>
  <text x="355" y="628" font-size="11" fill="#8b3a2b">后排缸高频爆震</text>
  <text x="480" y="628" font-size="11" font-weight="700" fill="#8b3a2b">降额 30%，频跳机</text>

  <rect x="40" y="644" width="574" height="96" rx="6" fill="#fff8eb" stroke="#d97706" stroke-width="1"/>
  <text x="52" y="665" font-size="11" font-weight="700" fill="#9a3412">物理机理（海拔 755–760m · 气压 92.6 kPa [-8.6%] · 冬 -35至-42°C / 夏 32–38°C）：</text>
  <text x="52" y="684" font-size="11" fill="#26231e">• 焦耳-汤姆逊节流降温+无伴热管线：当 C4 达 74.3、C5+ 达 51.1 mL/m³ 时，极寒下重烃</text>
  <text x="60" y="702" font-size="11" fill="#26231e">逼近露点凝析；11.3:1 机型抗爆震裕度击穿，ECM 大幅退点火角致后排缸活塞气门烧蚀。</text>
  <text x="52" y="722" font-size="11" fill="#115e59" font-weight="600">• 选型铁律：支线/伴生气须配 9.7:1 低压缩比机型 + 露点加热分离撬 + 在线色谱监测。</text>

  <!-- ==================== PANEL 4 (BOTTOM RIGHT): 5 FAULT CATEGORIES & 4 ROOT CAUSES ==================== -->
  <rect x="648" y="420" width="608" height="336" rx="8" fill="#fbf9f3" stroke="#d5ccb8" stroke-width="1.3"/>
  <text x="664" y="446" font-size="14.5" font-weight="700" fill="#26231e">④ 五大故障频次 / 停机大修损失权重与拆检实拍铁证（1,038 天统计）</text>
  <text x="664" y="464" font-size="11.5" fill="#6b6257">前三大故障（重烃爆震降额 34% + 极寒冷启动拉缸 28% + 浅基础沉降断轴 18%）占综合权重 80%</text>

  <line x1="664" y1="476" x2="1238" y2="476" stroke="#dfd7c6" stroke-width="1"/>
  <text x="668" y="494" font-size="11" font-weight="700" fill="#5c5346">故障类别与典型拆检损伤</text>
  <text x="985" y="494" font-size="11" font-weight="700" fill="#1e6091">频次占比</text>
  <text x="1065" y="494" font-size="11" font-weight="700" fill="#8b3a2b">停机损失</text>
  <text x="1145" y="494" font-size="11" font-weight="700" fill="#26231e">综合权重</text>
  <line x1="664" y1="502" x2="1238" y2="502" stroke="#dfd7c6" stroke-width="1"/>

  <text x="668" y="524" font-size="11" font-weight="700" fill="#8b3a2b">① 猛烈爆震与冬夏降额（活塞顶岸啃蚀/退点火角）</text>
  <text x="990" y="524" font-size="11" fill="#1e6091">39.0%</text>
  <text x="1070" y="524" font-size="11" fill="#8b3a2b">28.0%</text>
  <text x="1155" y="524" font-size="11.5" font-weight="700" fill="#8b3a2b">34.0%</text>

  <text x="668" y="550" font-size="11" font-weight="700" fill="#8b3a2b">② 极寒冷启动拉缸（16缸全拉伤/16活塞销高温发蓝）</text>
  <text x="990" y="550" font-size="11" fill="#1e6091">19.0%</text>
  <text x="1070" y="550" font-size="11" fill="#8b3a2b">32.0%</text>
  <text x="1155" y="550" font-size="11.5" font-weight="700" fill="#8b3a2b">28.0%</text>

  <text x="668" y="576" font-size="11" font-weight="700" fill="#b45309">③ 浅基础冻融沉降与 Gen 1 断轴（破箱吊电机返厂）</text>
  <text x="990" y="576" font-size="11" fill="#1e6091">4.5%</text>
  <text x="1070" y="576" font-size="11" fill="#8b3a2b">24.0%</text>
  <text x="1155" y="576" font-size="11.5" font-weight="700" fill="#b45309">18.0%</text>

  <text x="668" y="602" font-size="11" fill="#26231e">④ 2.5–3万h高工时水封漏水/油温高/气门挺柱磨损</text>
  <text x="990" y="602" font-size="11" fill="#1e6091">21.0%</text>
  <text x="1070" y="602" font-size="11" fill="#8b3a2b">11.0%</text>
  <text x="1155" y="602" font-size="11.5" font-weight="600" fill="#26231e">12.0%</text>

  <text x="668" y="628" font-size="11" fill="#26231e">⑤ 冬季冻雾防雪百叶冰堵窒息跳机 + 火花塞失效</text>
  <text x="990" y="628" font-size="11" fill="#1e6091">16.5%</text>
  <text x="1070" y="628" font-size="11" fill="#8b3a2b">5.0%</text>
  <text x="1155" y="628" font-size="11.5" font-weight="600" fill="#26231e">8.0%</text>

  <!-- Root Cause Summary Box -->
  <rect x="664" y="644" width="574" height="96" rx="6" fill="#eef6fb" stroke="#1e6091" stroke-width="1"/>
  <text x="676" y="665" font-size="11" font-weight="700" fill="#134074">两起灾难性损毁链条（单机对单箱 400V 孤岛直供、无并机母线、无备用机）：</text>
  <text x="676" y="684" font-size="11" fill="#26231e">• 冻土浅基础：冻土深 2.5–3.0m，40吨机组仅垫浅层无筋预制水泥墩+木托盘；冻融沉降</text>
  <text x="684" y="702" font-size="11" fill="#26231e">破坏同轴度，致 Gen 1 联轴器开裂、止推片偏磨烧蚀、前轴承碎裂与主轴高温退火。</text>
  <text x="676" y="722" font-size="11" fill="#8b3a2b" font-weight="600">• 极寒强行冷启动：单机停机即断电，无保温下强行盘车烧起动机，油膜缺失致 16 缸拉伤。</text>
</svg>
