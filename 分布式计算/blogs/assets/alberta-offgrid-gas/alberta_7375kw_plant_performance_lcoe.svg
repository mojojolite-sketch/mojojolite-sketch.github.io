  <!-- Thermal Efficiency & Auxiliary Loss Callout Box -->
  <rect x="40" y="280" width="574" height="112" rx="6" fill="#f3ede0" stroke="#c7bba3" stroke-width="1"/>
  <text x="52" y="300" font-size="11.5" font-weight="700" fill="#5c4728">热耗率与真实热效率核查（总耗气 643,135.82 GJ · cos φ = 0.98 vs 额定 0.80）</text>
  <text x="52" y="319" font-size="11" fill="#26231e">• 热耗率：2023年 12.299 GJ/MWh (29.27%) | 2024表观 11.535 (31.21%，剔除抄表错位</text>
  <text x="60" y="336" font-size="11" fill="#26231e">与 39.11 vs 40.6–41.7 MJ/m³ 热值偏差后为 28.85%) | 2025年 12.436 (28.95%)</text>
  <text x="52" y="355" font-size="11" fill="#8b3a2b" font-weight="600">• 全周期 12.149 GJ/MWh (29.63% / 还原 29.08%)，较标称 38.5% 净跌约 9.4 个百分点</text>
  <text x="52" y="374" font-size="11" fill="#115e59">• 厂用电损耗：23年 3.37% | 24年 2.00% | 25年 3.38% | 综合 3.06%（初始工时 18,334h）</text>

