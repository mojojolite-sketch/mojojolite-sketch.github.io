  <!-- Legend below OpEx bar -->
  <text x="664" y="186" font-size="11" fill="#1e6091" font-weight="600">■ 天然气净采购 28.5%</text>
  <text x="825" y="186" font-size="11" fill="#3a7ca5" font-weight="600">■ 管道容量与输送 12.0%</text>
  <text x="1005" y="186" font-size="11" fill="#4361ee" font-weight="600">■ 碳税相关项目 11.1%</text>
