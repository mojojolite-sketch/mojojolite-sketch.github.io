  <rect x="785" y="277" width="184" height="16" rx="3" fill="#8b3a2b"/>
  <text x="977" y="290" font-size="11.5" font-weight="700" fill="#8b3a2b">$0.0688/kWh (9.38 ¢ · 翻倍 +93.8%)</text>

  <text x="664" y="316" font-size="11.5" font-weight="600" fill="#5c4728">+ 二手机折旧摊销</text>
  <rect x="969" y="303" width="82" height="16" rx="3" fill="#6b6257"/>
