  <text x="825" y="204" font-size="11" fill="#b45309" font-weight="600">■ 现场运维人工 19.9%</text>
  <text x="1005" y="204" font-size="11" fill="#5c5346" font-weight="600">■ 营地与行政杂费 5.7%</text>

  <!-- 3-Tier LCOE Waterfall Table/Bars -->
  <line x1="664" y1="216" x2="1238" y2="216" stroke="#dfd7c6" stroke-width="1"/>
  <text x="664" y="238" font-size="11.5" font-weight="700" fill="#1e6091">① 直接燃料成本</text>
  <rect x="785" y="225" width="95" height="16" rx="3" fill="#1e6091"/>
