<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="img" aria-label="阿尔伯塔 7.375MW 燃气内燃机电厂 1038 天运行实证、三级度电成本与气质爆震归因" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Leuchtturm1917 Chamois Cream Background -->
  <rect x="0" y="0" width="1280" height="780" rx="10" fill="#f7f3e8" stroke="#cfc6b4" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="36" font-size="19" font-weight="700" fill="#26231e">阿尔伯塔 7.375 MW 离网内燃机电厂 1,038 天实证（5 × 1.475 MW 16缸二手机组 · 2023.01–2025.11）</text>
  <text x="28" y="58" font-size="12.5" fill="#6b6257">Unit: MWh / GJ / % / USD per kWh (CAD ¢/kWh) · 累计新增开机 51,016 台时 · 毛发电 52,936.96 MWh · 净供电 51,315.48 MWh</text>

  <!-- ==================== PANEL 1 (TOP LEFT): 3-YEAR OUTPUT & UTILIZATION COLLAPSE ==================== -->
