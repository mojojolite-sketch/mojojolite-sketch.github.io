<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .bg { fill: #FAF7F0; }
      .card { fill: #FFFFFF; stroke: #D8D0C0; stroke-width: 1.5; rx: 8; }
      .card-warn { fill: #FFF8F5; stroke: #C95B3C; stroke-width: 1.5; rx: 8; }
      .card-ok { fill: #F4F9F5; stroke: #2E6F4E; stroke-width: 1.5; rx: 8; }
      .header { fill: #1F2421; font-size: 18.5px; font-weight: 700; }
      .sub { fill: #5A554C; font-size: 12.5px; }
      .box-title { fill: #1F2421; font-size: 14px; font-weight: 700; }
      .box-title-warn { fill: #A63A20; font-size: 13.5px; font-weight: 700; }
      .box-title-ok { fill: #1E563A; font-size: 13.5px; font-weight: 700; }
      .body { fill: #33302B; font-size: 11.6px; }
      .label { fill: #1F2421; font-size: 11.8px; font-weight: 600; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.2px; fill: #2B4C6F; }
      .bar-bg { fill: #EFECE4; rx: 4; }
      .bar-p1 { fill: #2B4C6F; rx: 4; }
      .bar-p8 { fill: #8FB1CC; rx: 4; }
      .bar-pow8 { fill: #C95B3C; rx: 3; }
      .bar-ace { fill: #2E6F4E; rx: 4; }
      .bar-shop { fill: #C95B3C; rx: 4; }
      .grid { stroke: #E2DACB; stroke-width: 1; stroke-dasharray: 3,3; }
    </style>
  </defs>

  <rect width="1280" height="680" class="bg" rx="10"/>

  <text x="28" y="36" class="header">企业跨软件长程执行 vs. 消费实时联网核查：APEX-Agents 与 ACE 前沿模型实测瓶颈对比</text>
  <text x="28" y="56" class="sub">数据来源：Mercor 一手论文 arXiv:2601.14242 (APEX-Agents, n=480) 与 arXiv:2512.04921 (ACE-v1-heldout, n=400) · 本工作台整理复核</text>

  <!-- Left Panel: APEX-Agents -->
  <rect x="28" y="74" width="606" height="580" class="card"/>
  <text x="46" y="100" class="box-title">① APEX-Agents (arXiv:2601.14242)：企业多应用长程任务跑分（0%–50% 标尺）</text>
  <text x="46" y="118" class="sub">深蓝 = Pass@1（单次全过） · 浅蓝 = Pass@8（8次至少1过） · 砖红 = Pass^8（8次连续全过）</text>

  <!-- Grid lines: x=220 is 0%, width 360 represents 50% (7.2px per 1%) -->
  <line x1="220" y1="132" x2="220" y2="392" stroke="#B8B0A0" stroke-width="1.2"/>
  <line x1="292" y1="132" x2="292" y2="392" class="grid"/>
  <line x1="364" y1="132" x2="364" y2="392" class="grid"/>
  <line x1="436" y1="132" x2="436" y2="392" class="grid"/>
  <line x1="508" y1="132" x2="508" y2="392" class="grid"/>
  <line x1="580" y1="132" x2="580" y2="392" class="grid"/>
  <text x="215" y="408" class="mono">0%</text>
  <text x="282" y="408" class="mono">10%</text>
  <text x="354" y="408" class="mono">20%</text>
  <text x="426" y="408" class="mono">30%</text>
  <text x="498" y="408" class="mono">40%</text>
  <text x="568" y="408" class="mono">50%</text>

  <!-- Row 1: Gemini 3 Flash -->
  <text x="46" y="152" class="label">Gemini 3 Flash (High)</text>
  <rect x="220" y="138" width="264" height="10" class="bar-p8"/>
  <rect x="220" y="138" width="173" height="10" class="bar-p1"/>
  <rect x="220" y="150" width="96" height="6" class="bar-pow8"/>
  <text x="490" y="148" class="mono">24.0% | P@8 36.7% | P^8 13.4%</text>

  <!-- Row 2: GPT-5.2 -->
  <text x="46" y="184" class="label">GPT-5.2 (High)</text>
  <rect x="220" y="170" width="288" height="10" class="bar-p8"/>
  <rect x="220" y="170" width="166" height="10" class="bar-p1"/>
  <rect x="220" y="182" width="79" height="6" class="bar-pow8"/>
  <text x="514" y="180" class="mono">23.0% | P@8 40.0%</text>

  <!-- Row 3: Claude Opus 4.5 -->
  <text x="46" y="216" class="label">Claude Opus 4.5 (High)</text>
  <rect x="220" y="202" width="245" height="10" class="bar-p8"/>
  <rect x="220" y="202" width="132" height="10" class="bar-p1"/>
  <rect x="220" y="214" width="63" height="6" class="bar-pow8"/>
  <text x="471" y="212" class="mono">18.4% | P@8 34.0% | P^8 8.8%</text>

  <!-- Row 4: Gemini 3 Pro -->
  <text x="46" y="248" class="label">Gemini 3 Pro (High)</text>
  <rect x="220" y="234" width="269" height="10" class="bar-p8"/>
  <rect x="220" y="234" width="132" height="10" class="bar-p1"/>
  <rect x="220" y="246" width="47" height="6" class="bar-pow8"/>
  <text x="495" y="244" class="mono">18.4% | P@8 37.3% | P^8 6.5%</text>

  <!-- Row 5: GPT-5 -->
  <text x="46" y="280" class="label">GPT-5 (High)</text>
  <rect x="220" y="266" width="223" height="10" class="bar-p8"/>
  <rect x="220" y="266" width="132" height="10" class="bar-p1"/>
  <rect x="220" y="278" width="55" height="6" class="bar-pow8"/>
  <text x="449" y="276" class="mono">18.3% | P@8 31.0% | P^8 7.7%</text>

  <!-- Row 6: Grok 4 -->
  <text x="46" y="312" class="label">Grok 4</text>
  <rect x="220" y="298" width="237" height="10" class="bar-p8"/>
  <rect x="220" y="298" width="109" height="10" class="bar-p1"/>
  <rect x="220" y="310" width="34" height="6" class="bar-pow8"/>
  <text x="463" y="308" class="mono">15.2% | P@8 32.9% | P^8 4.7%</text>

  <!-- Row 7: GPT-OSS-120B -->
  <text x="46" y="344" class="label">GPT-OSS-120B (开源)</text>
  <rect x="220" y="330" width="83" height="10" class="bar-p8"/>
  <rect x="220" y="330" width="34" height="10" class="bar-p1"/>
  <rect x="220" y="342" width="9" height="6" class="bar-pow8"/>
  <text x="310" y="340" class="mono">4.7% | P@8 11.5% | P^8 1.2%</text>

  <!-- Row 8: Kimi K2 Thinking -->
  <text x="46" y="376" class="label">Kimi K2 Thinking (开源)</text>
  <rect x="220" y="362" width="104" height="10" class="bar-p8"/>
  <rect x="220" y="362" width="29" height="10" class="bar-p1"/>
  <rect x="220" y="374" width="3" height="6" class="bar-pow8"/>
  <text x="330" y="372" class="mono">4.0% | P@8 14.4% (均值 ~92步)</text>

  <!-- Left Bottom Insights -->
  <rect x="46" y="422" width="570" height="214" class="card-warn"/>
  <text x="58" y="443" class="box-title-warn">✅ 本工作台核查：APEX-Agents 暴露的三大长程工程瓶颈</text>
  <text x="58" y="464" class="body">1. 为什么轻量 Gemini 3 Flash (24.0%) 反超旗舰 Gemini 3 Pro / Claude Opus 4.5 (18.4%)？</text>
  <text x="58" y="482" class="body">   在 100 步上限与 166 个文件检索中，重型推理模型单步思考冗长，极易在后半程耗尽上下文预算或</text>
  <text x="58" y="500" class="body">   触发 10,800s 超时（如 Kimi K2 平均高达 ~92 步），而 Flash 具备更高工具迭代周转率与纠错余量。</text>
  <text x="58" y="522" class="body">2. Pass@8 (40.0%) vs. Pass^8 (11.0%) 的可靠性鸿沟：GPT-5.2 抽样 8 次虽有 40% 概率撞对一次，</text>
  <text x="58" y="540" class="body">   但要求 8 次全部稳定通过（Pass^8）时暴跌至 11.0%——证明模型具备局部技能，却缺乏生产级确定性。</text>
  <text x="58" y="562" class="body">3. 三大高薪领域封顶线：投行建模最高 27.3%（GPT-5.2，死于跨表高精度财务勾稽链断裂）、</text>
  <text x="58" y="580" class="body">   公司法最高 25.9%（Gemini 3 Flash）、管理咨询最高仅 22.7%（死于多源非结构化定性材料综合）。</text>
  <text x="58" y="602" class="mono">开源 vs 闭源断层：GPT-OSS-120B (4.7%) 与 Kimi K2 (4.0%) 不足闭源头部 Pass@1 的 1/5</text>
  <text x="58" y="622" class="sub">注：Mean Score（按子条目平均得分率）头部约 34%–39.5%，但企业交付不允许「对 3 条错 1 条致命项」</text>

  <!-- Right Panel: ACE Consumer Index -->
  <rect x="652" y="74" width="600" height="580" class="card"/>
  <text x="670" y="100" class="box-title">② AI Consumer Index / ACE (arXiv:2512.04921)：消费联网核查跑分（0%–80%）</text>
  <text x="670" y="118" class="sub">开启实时 Web Search 评测 · 400 道闭源 Held-out 题（Shopping / Food / Gaming / DIY 各 100 题）</text>

  <!-- Top Aggregate Leaderboard -->
  <rect x="670" y="132" width="564" height="114" class="card-ok"/>
  <text x="684" y="152" class="box-title-ok">ACE-v1-heldout 全局总分榜 Top 3（天花板卡在 ~56%）</text>

  <text x="684" y="176" class="label">1. GPT-5 (Thinking = High)</text>
  <rect x="885" y="164" width="280" height="14" class="bar-bg"/>
  <rect x="885" y="164" width="196" height="14" class="bar-ace"/>
  <text x="1090" y="176" class="mono">56.1%</text>

  <text x="684" y="202" class="label">2. OpenAI o3 Pro (Thinking = On)</text>
  <rect x="885" y="190" width="280" height="14" class="bar-bg"/>
  <rect x="885" y="190" width="193" height="14" class="bar-ace"/>
  <text x="1090" y="202" class="mono">55.2%</text>

  <text x="684" y="228" class="label">3. GPT-5.1 (Thinking = High)</text>
  <rect x="885" y="216" width="280" height="14" class="bar-bg"/>
  <rect x="885" y="216" width="193" height="14" class="bar-ace"/>
  <text x="1090" y="228" class="mono">55.1%</text>

  <!-- Four Consumer Domains Breakdown -->
  <rect x="670" y="258" width="564" height="162" class="card"/>
  <text x="684" y="279" class="box-title">四大消费决策场景分化（纠正误传：ACE 不含医疗，医疗在单轮 APEX-v1）</text>

  <text x="684" y="306" class="label">🍽️ Food（餐饮食谱/忌口规划）</text>
  <rect x="885" y="294" width="245" height="14" class="bar-ace"/>
  <text x="1138" y="306" class="mono">最高 ~70.0%</text>

  <text x="684" y="334" class="label">🔧 DIY（家居维修/排障指南）</text>
  <rect x="885" y="322" width="214" height="14" class="bar-p1"/>
  <text x="1106" y="334" class="mono">28%–61% (安全警告&lt;50%)</text>

  <text x="684" y="362" class="label">🎮 Gaming（装机兼容/推荐）</text>
  <rect x="885" y="350" width="210" height="14" class="bar-p1"/>
  <text x="1102" y="362" class="mono">28%–61% (硬件兼容&lt;40%)</text>

  <text x="684" y="390" class="label">🛒 Shopping（实时网购比价）</text>
  <rect x="885" y="378" width="168" height="14" class="bar-shop"/>
  <text x="1062" y="390" class="mono">全员 &lt;50.0%（全场垫底）</text>
  <text x="684" y="410" class="sub">注：简单数量约束得分可达 ~80%，一旦涉及实时库存、精确现价与购买直链即大规模失分</text>

  <!-- Why Shopping <50% -->
  <rect x="670" y="432" width="564" height="204" class="card-warn"/>
  <text x="684" y="453" class="box-title-warn">⚠️ 为什么所有前沿模型在实时网购（Shopping）域得分均 &lt;50%？</text>
  <text x="684" y="474" class="body">1. Hurdle Criteria（跨栏门槛一票否决）+ 74% 动态 Grounding 负分倒扣机制：</text>
  <text x="684" y="492" class="body">   ACE 对未满足要求计 0 分，但对「网页来源无法证实的编造价格/死链/断货商品」直接扣负分；</text>
  <text x="684" y="510" class="body">   Shopping 域高达 74% 的评分项强制绑定实时网页核验（Gaming 为 42%），幻觉越多净得分越低。</text>
  <text x="684" y="532" class="body">2. 电商反爬隔离墙与 JS 动态渲染黑盒（Anti-Bot &amp; DOM Wall）：</text>
  <text x="684" y="550" class="body">   Amazon、Walmart、BestBuy 等头部零售商对搜索爬虫拦截极严，模型自带 Web Search 往往只能抓到</text>
  <text x="684" y="568" class="body">   搜索引擎缓存的过时 SEO 摘要（Snippet），看不到结账页真实尺码库存、运费与限时折扣。</text>
  <text x="684" y="590" class="body">3. 预训练过时价格锚定（Stale Price Anchoring）：当实时抓取受阻时，RLHF 训练出的「讨好顺从倾向」</text>
  <text x="684" y="608" class="body">   诱导模型用权重记忆里的历史发售指导价（MSRP）或猜测 URL 强行作答，瞬间触发负分惩罚。</text>
  <text x="684" y="626" class="mono">商业推论：通用 Web Search 无法替代交易级电商 API / 授权 Browser Sandbox（如 Browserbase）</text>
</svg>
