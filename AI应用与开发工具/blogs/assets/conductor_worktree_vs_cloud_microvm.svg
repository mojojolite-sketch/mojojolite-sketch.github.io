<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 670" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .bg { fill: #FAF7F0; }
      .card { fill: #FFFFFF; stroke: #D8D0C0; stroke-width: 1.5; rx: 8; }
      .card-warn { fill: #FFF8F5; stroke: #C95B3C; stroke-width: 1.5; rx: 8; }
      .card-ok { fill: #F4F9F5; stroke: #2E6F4E; stroke-width: 1.5; rx: 8; }
      .header { fill: #1F2421; font-size: 18px; font-weight: 700; }
      .sub { fill: #5A554C; font-size: 12.5px; }
      .box-title { fill: #1F2421; font-size: 14px; font-weight: 700; }
      .box-title-warn { fill: #A63A20; font-size: 13.5px; font-weight: 700; }
      .box-title-ok { fill: #1E563A; font-size: 14px; font-weight: 700; }
      .body { fill: #33302B; font-size: 11.8px; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.2px; fill: #2B4C6F; }
      .badge { fill: #EAE3D2; stroke: #C5BBA4; stroke-width: 1; rx: 6; }
      .arrow { stroke: #4A6B82; stroke-width: 2.2; fill: none; marker-end: url(#arrow-head); }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4A6B82"/>
    </marker>
  </defs>

  <rect width="1260" height="670" class="bg" rx="10"/>

  <text x="28" y="36" class="header">从本地编排到云端 MicroVM 沙盒：Conductor (git worktree) vs. 多租户并发 Agent 隔离架构</text>
  <text x="28" y="56" class="sub">本工作台工程还原：为什么 Agent 并发数提升 10× 会触发 CPU 线程与内存工作集 10×–50× 膨胀，且必须用硬件虚拟化沙盒替代进程/容器共享</text>

  <!-- Left Panel: Local Conductor -->
  <rect x="28" y="74" width="588" height="338" class="card"/>
  <text x="46" y="100" class="box-title">① 本地客户端层：Conductor (Melty Labs · YC S24 · macOS)</text>
  <text x="46" y="118" class="sub">实质定位：多 Agent 本地并行编排器（Orchestrator），非内核级安全虚拟机</text>

  <rect x="46" y="132" width="552" height="68" class="badge"/>
  <text x="58" y="152" class="box-title">底层隔离原语：Git Worktree + APFS Copy-on-Write 文件目录</text>
  <text x="58" y="170" class="mono">git worktree add ../ws-agent-1 -b feat/auth   (共享同一 .git 对象库)</text>
  <text x="58" y="188" class="mono">git worktree add ../ws-agent-2 -b fix/payment (独立工作树防文件覆写)</text>

  <rect x="46" y="212" width="174" height="82" class="card"/>
  <text x="58" y="232" class="box-title">Worktree #1</text>
  <text x="58" y="250" class="body">Claude Code 实例 A</text>
  <text x="58" y="268" class="mono">前端组件重构</text>
  <text x="58" y="284" class="sub">独立文件目录</text>

  <rect x="235" y="212" width="174" height="82" class="card"/>
  <text x="247" y="232" class="box-title">Worktree #2</text>
  <text x="247" y="250" class="body">OpenAI Codex 实例 B</text>
  <text x="247" y="268" class="mono">后端 API 与迁移</text>
  <text x="247" y="284" class="sub">独立文件目录</text>

  <rect x="424" y="212" width="174" height="82" class="card"/>
  <text x="436" y="232" class="box-title">Worktree #3</text>
  <text x="436" y="250" class="body">Claude Code 实例 C</text>
  <text x="436" y="268" class="mono">单元测试与 CI 脚本</text>
  <text x="436" y="284" class="sub">独立文件目录</text>

  <rect x="46" y="306" width="552" height="90" class="card-warn"/>
  <text x="58" y="326" class="box-title-warn">⚠️ 本地 Worktree 的物理边界（为何上云必须重构）：</text>
  <text x="58" y="346" class="body">• 仅隔离代码目录，共享宿主机 macOS 内核、环境变量（~/.ssh, AWS 密钥）与本地端口</text>
  <text x="58" y="365" class="body">• 单机开 8–10 个 Agent 跑编译/测试即榨干 M4 Max 内存（32–64GB）与 CPU 线程</text>
  <text x="58" y="384" class="body">• 收购后动作：Conductor Cloud 于 2026-11-20 永久关停，转入 Meta 内部云端沙盒重构</text>

  <!-- Right Panel: Cloud Multi-Tenant MicroVM Sandbox -->
  <rect x="640" y="74" width="592" height="338" class="card-ok"/>
  <text x="658" y="100" class="box-title-ok">② 云端生产层：多租户高并发 Agent 安全沙盒（MicroVM / Wasm）</text>
  <text x="658" y="118" class="sub">代表底座：E2B / Together (CodeSandbox) / Modal / Daytona / Cloudflare / Akamai</text>

  <rect x="658" y="132" width="556" height="68" class="badge"/>
  <text x="670" y="152" class="box-title">底层隔离原语：Firecracker MicroVM / KVM 硬件虚拟化 + 内存快照分叉</text>
  <text x="670" y="170" class="mono">vm.fork() -&gt; 2–150ms 克隆完整 Linux 内存页 (Copy-on-Write Memory Snapshot)</text>
  <text x="670" y="188" class="mono">每个子 Agent 独占 Guest Kernel + 虚拟网卡 tap0 + 独立 RootFS + AMD SEV-SNP</text>

  <rect x="658" y="212" width="176" height="82" class="card"/>
  <text x="670" y="232" class="box-title-ok">MicroVM #101</text>
  <text x="670" y="250" class="body">2 vCPU · 4GB RAM</text>
  <text x="670" y="268" class="mono">独立 Linux 内核</text>
  <text x="670" y="284" class="sub">150ms 冷启 / 2ms 分叉</text>

  <rect x="848" y="212" width="176" height="82" class="card"/>
  <text x="860" y="232" class="box-title-ok">MicroVM #102</text>
  <text x="860" y="250" class="body">2 vCPU · 4GB RAM</text>
  <text x="860" y="268" class="mono">独立 Linux 内核</text>
  <text x="860" y="284" class="sub">网络白名单 Egress</text>

  <rect x="1038" y="212" width="176" height="82" class="card"/>
  <text x="1050" y="232" class="box-title-ok">MicroVM #N</text>
  <text x="1050" y="250" class="body">按秒计费 · 用完即焚</text>
  <text x="1050" y="268" class="mono">SEV-SNP 内存加密</text>
  <text x="1050" y="284" class="sub">单机切分数百实例</text>

  <rect x="658" y="306" width="556" height="90" class="card-warn"/>
  <text x="670" y="326" class="box-title-warn">🔥 Meta Muse 前车之鉴（2026.08–10 三连安全事故验证沙盒刚需）：</text>
  <text x="670" y="346" class="body">• KVM 影子页表逃逸漏洞（Januscape, CVE-2026-53359）险些让 Agent 穿透宿主机</text>
  <text x="670" y="365" class="body">• 2026.10 会话分享子域名泄露至公共被动 DNS，外部无需认证即可检索他人私密记录</text>
  <text x="670" y="384" class="body">• 2026.09 macOS 端侧未鉴权 XPC 端点暴露，迫使 Meta 全面升级硬件级沙盒隔离</text>

  <!-- Bottom Panel: GPU vs CPU Asymmetry -->
  <rect x="28" y="428" width="1204" height="218" class="card"/>
  <text x="46" y="454" class="box-title">③ 算力经济学剪刀差：为什么 Agent 越多，CPU 线程与 MicroVM 沙盒需求呈指数级爆发？</text>

  <rect x="46" y="470" width="336" height="156" class="badge"/>
  <text x="62" y="494" class="box-title">GPU 推理端（毫秒级脉冲）</text>
  <text x="62" y="518" class="body">• LLM 吐出 1 条工具调用指令仅需 50–80 Tokens</text>
  <text x="62" y="540" class="body">• H200 / B200 耗时仅 0.3–0.8 秒（高吞吐 Batching）</text>
  <text x="62" y="562" class="body">• 吐完 Token 后 GPU 立即释放去服务下一个请求</text>
  <text x="62" y="592" class="mono">GPU 占空比: ~5%–10% (短促脉冲)</text>

  <path d="M 392 546 L 452 546" class="arrow"/>
  <text x="396" y="534" class="mono">1:20 放大</text>

  <rect x="464" y="470" width="750" height="156" class="card-ok"/>
  <text x="482" y="494" class="box-title-ok">CPU + 内存沙盒端（秒至分钟级重负载 · 100% 跑在 Server CPU 与虚拟化层）</text>
  <text x="482" y="518" class="body">• 1 条指令触发：git clone → npm/pip 编译构建 → 跑 200 个单元测试 → Headless Chrome 渲染（耗时 15–180 秒）</text>
  <text x="482" y="540" class="body">• 并发乘数：1 个工程师用 Conductor/Cursor 派发 10 个子 Agent × 试错 5 轮 = 50 个并发 Linux 沙盒争抢 CPU 线程</text>
  <text x="482" y="562" class="body">• 硬件隔离硬约束：Agent 执行不可信动态代码（Untrusted Code），必须用 VT-x / KVM / Firecracker 将 CPU 线程</text>
  <text x="482" y="582" class="body">  关进独立硬件地址空间，直接引爆 Anthropic → Akamai $11.6B 全 CPU 合同与 AMD EPYC Turin (192核/384线程) 抢购潮</text>
  <text x="482" y="606" class="mono">CPU 沙盒占空比: ~90%–95% | 单用户峰值并发: 10–50 MicroVMs (20–100 vCPUs)</text>
</svg>
