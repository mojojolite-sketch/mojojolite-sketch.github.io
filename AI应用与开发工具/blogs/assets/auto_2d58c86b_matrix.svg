<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 491" width="960" height="491" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Helvetica Neue&#x27;, sans-serif">
  <rect x="0" y="0" width="960" height="491" rx="8" fill="#FAF7F0"/>
  <text x="34.0" y="32.0" fill="#1E563A" font-size="11" font-weight="600">CROSS-CHECK MATRIX · AI应用与开发工具</text>
  <text x="34.0" y="56.0" fill="#1F2421" font-size="18" font-weight="700">Harvey vs GC AI</text>
  <text x="34.0" y="76.0" fill="#5A554C" font-size="12.2" font-weight="400">三、赛道横向对比：Harvey vs GC AI 的架构与商业边界对照（结合 Harvey 档案 与 GC AI 档案）</text>
  <rect x="34.0" y="96" width="437.0" height="333" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="34.0" y="96" width="437.0" height="5" rx="2" fill="#2B4C6F"/>
  <text x="50.0" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">Harvey（大律所与头部企业全栈切入）</text>
  <text x="50.0" y="147.0" fill="#5A554C" font-size="11.2" font-weight="400">资本化与规模定位</text>
  <text x="50.0" y="163.0" fill="#2E322F" font-size="11.8" font-weight="400">Harvey 主体档案 登记官网披露融资 $550M、估值 $15.5B，以大型律所与大</text>
  <text x="50.0" y="179.0" fill="#2E322F" font-size="11.8" font-weight="400">型企业法务为主要客群，重点攻坚复杂尽调、诉讼与定制化大单</text>
  <line x1="50.0" y1="201" x2="455.0" y2="201" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="215.0" fill="#5A554C" font-size="11.2" font-weight="400">Agent 工程重心差异</text>
  <text x="50.0" y="231.0" fill="#2E322F" font-size="11.8" font-weight="400">内部研发 Spectre 协作 Agent 与 MCP Policy Engine，并将工程化</text>
  <text x="50.0" y="247.0" fill="#2E322F" font-size="11.8" font-weight="400">MCP+Figma+Claude 追踪器反向外溢至市场营销部门，实现 ABM 账户级定制</text>
  <text x="50.0" y="263.0" fill="#2E322F" font-size="11.8" font-weight="400">视频规模化触达</text>
  <line x1="50.0" y1="285" x2="455.0" y2="285" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="299.0" fill="#5A554C" font-size="11.2" font-weight="400">获客与销售杠杆</text>
  <text x="50.0" y="315.0" fill="#2E322F" font-size="11.8" font-weight="400">依靠高客单 ABM 销售团队与定制化账户演示（44 套模块 +</text>
  <text x="50.0" y="331.0" fill="#2E322F" font-size="11.8" font-weight="400">Gong/Salesforce 上下文自动合成），用算力换取销售前置触达覆盖率</text>
  <line x1="50.0" y1="353" x2="455.0" y2="353" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="367.0" fill="#5A554C" font-size="11.2" font-weight="400">核心张力</text>
  <text x="50.0" y="383.0" fill="#2E322F" font-size="11.8" font-weight="400">大模型与生图/语音 MCP 账单随 ABM 规模线性攀升；且顶级律所按小时计费</text>
  <text x="50.0" y="399.0" fill="#2E322F" font-size="11.8" font-weight="400">模式与 AI 提效之间存在长期商业摩擦</text>
  <rect x="489.0" y="96" width="437.0" height="333" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="489.0" y="96" width="437.0" height="5" rx="2" fill="#1E563A"/>
  <text x="505.0" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">GC AI（聚焦企业内部法务工作流）</text>
  <text x="505.0" y="147.0" fill="#5A554C" font-size="11.2" font-weight="400">资本化与规模定位</text>
  <text x="505.0" y="163.0" fill="#2E322F" font-size="11.8" font-weight="400">GC AI 档案 与 官方对比页 显示累计融资 $73M（B 轮估值 $555M），ARR 突</text>
  <text x="505.0" y="179.0" fill="#2E322F" font-size="11.8" font-weight="400">破 $40M、服务 2,200+ 家企业（97% 收入来自企业内部法务）</text>
  <line x1="505.0" y1="201" x2="910.0" y2="201" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="505.0" y="215.0" fill="#5A554C" font-size="11.2" font-weight="400">Agent 工程重心差异</text>
  <text x="505.0" y="231.0" fill="#2E322F" font-size="11.8" font-weight="400">将多智能体编排集中在高容错底线产品端：Orchestrator 50 步预算扇出 28</text>
  <text x="505.0" y="247.0" fill="#2E322F" font-size="11.8" font-weight="400">路并行 Playbook 子循环 + 交付前字符级 Verification Node，确保零失误</text>
  <text x="505.0" y="263.0" fill="#2E322F" font-size="11.8" font-weight="400">引用</text>
  <line x1="505.0" y1="285" x2="910.0" y2="285" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="505.0" y="299.0" fill="#5A554C" font-size="11.2" font-weight="400">获客与销售杠杆</text>
  <text x="505.0" y="315.0" fill="#2E322F" font-size="11.8" font-weight="400">依靠总法律顾问免费公开课（培训数千名律师）、45 位 GC 联合 SPV 背书及</text>
  <text x="505.0" y="331.0" fill="#2E322F" font-size="11.8" font-weight="400">~30% 跨部门（采购/HR）席位口碑扩散，获客营销极度轻量化</text>
  <line x1="505.0" y1="353" x2="910.0" y2="353" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="505.0" y="367.0" fill="#5A554C" font-size="11.2" font-weight="400">核心张力</text>
  <text x="505.0" y="383.0" fill="#2E322F" font-size="11.8" font-weight="400">随着 Harvey 补充 Word 插件、Contract Intelligence 级 Vault 与企业法</text>
  <text x="505.0" y="399.0" fill="#2E322F" font-size="11.8" font-weight="400">务 Playbook，GC AI 能否守住 139% NRR 与企业法务细分心智</text>
  <text x="34.0" y="455.0" fill="#5A554C" font-size="12.2" font-weight="400">依据 Harvey两周烧156亿token，营销部门变成代码库 原文表格自动编译</text>
</svg>
