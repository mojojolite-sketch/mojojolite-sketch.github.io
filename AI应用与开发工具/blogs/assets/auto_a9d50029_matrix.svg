<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Helvetica Neue&#x27;, sans-serif">
  <rect x="0" y="0" width="960" height="418" rx="8" fill="#FAF7F0"/>
  <text x="34.0" y="32.0" fill="#1E563A" font-size="11" font-weight="600">CROSS-CHECK MATRIX · AI应用与开发工具</text>
  <text x="34.0" y="56.0" fill="#1F2421" font-size="18" font-weight="700">单线程线性 + 专用历史压缩 vs 主代理 + 只读检索子代理 vs 对等自由协商多代理网络</text>
  <text x="34.0" y="76.0" fill="#5A554C" font-size="12.2" font-weight="400">三、赛道横向对比（2025 年中三种 Agent 协作范式）</text>
  <rect x="34.0" y="96" width="285.3" height="260" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="34.0" y="96" width="285.3" height="5" rx="2" fill="#2B4C6F"/>
  <text x="50.0" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">单线程线性 + 专用历史压缩</text>
  <text x="50.0" y="147.0" fill="#5A554C" font-size="11.2" font-weight="400">代表实现</text>
  <text x="50.0" y="163.0" fill="#2E322F" font-size="11.8" font-weight="400">Cognition (Devin)</text>
  <line x1="50.0" y1="185" x2="303.3" y2="185" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="199.0" fill="#5A554C" font-size="11.2" font-weight="400">上下文共享与写入权限</text>
  <text x="50.0" y="215.0" fill="#2E322F" font-size="11.8" font-weight="400">完整共享执行轨迹，单点连续写入；微调小模型</text>
  <text x="50.0" y="231.0" fill="#2E322F" font-size="11.8" font-weight="400">做历史状态压缩</text>
  <line x1="50.0" y1="253" x2="303.3" y2="253" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="50.0" y="267.0" fill="#5A554C" font-size="11.2" font-weight="400">工程可靠性与主要瓶颈（2025-06 口径）</text>
  <text x="50.0" y="283.0" fill="#2E322F" font-size="11.8" font-weight="400">✅ 避免隐式决策冲突；⚠️ 仍受长上下文窗口绝</text>
  <text x="50.0" y="299.0" fill="#2E322F" font-size="11.8" font-weight="400">对上限与压缩模型信息损耗约束</text>
  <rect x="337.3" y="96" width="285.3" height="260" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="337.3" y="96" width="285.3" height="5" rx="2" fill="#1E563A"/>
  <text x="353.3" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">主代理 + 只读检索子代理</text>
  <text x="353.3" y="147.0" fill="#5A554C" font-size="11.2" font-weight="400">代表实现</text>
  <text x="353.3" y="163.0" fill="#2E322F" font-size="11.8" font-weight="400">Anthropic (Claude Code Subagents)</text>
  <line x1="353.3" y1="185" x2="606.7" y2="185" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="353.3" y="199.0" fill="#5A554C" font-size="11.2" font-weight="400">上下文共享与写入权限</text>
  <text x="353.3" y="215.0" fill="#2E322F" font-size="11.8" font-weight="400">子代理隔离探索上下文，只返还问题答案，不执</text>
  <text x="353.3" y="231.0" fill="#2E322F" font-size="11.8" font-weight="400">行并行代码写入</text>
  <line x1="353.3" y1="253" x2="606.7" y2="253" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="353.3" y="267.0" fill="#5A554C" font-size="11.2" font-weight="400">工程可靠性与主要瓶颈（2025-06 口径）</text>
  <text x="353.3" y="283.0" fill="#2E322F" font-size="11.8" font-weight="400">✅ 延长主代理上下文寿命且不破坏写一致性；⚠</text>
  <text x="353.3" y="299.0" fill="#2E322F" font-size="11.8" font-weight="400">️ 并行算力仅能加速信息检索，无法并行加速写</text>
  <text x="353.3" y="315.0" fill="#2E322F" font-size="11.8" font-weight="400">入交付</text>
  <rect x="640.7" y="96" width="285.3" height="260" rx="6" fill="#FFFFFF" stroke="#D8D0C0" stroke-width="1.4"/>
  <rect x="640.7" y="96" width="285.3" height="5" rx="2" fill="#945610"/>
  <text x="656.7" y="124.0" fill="#1F2421" font-size="13.5" font-weight="700">对等自由协商多代理网络</text>
  <text x="656.7" y="147.0" fill="#5A554C" font-size="11.2" font-weight="400">代表实现</text>
  <text x="656.7" y="163.0" fill="#2E322F" font-size="11.8" font-weight="400">OpenAI Swarm / Microsoft AutoGen /</text>
  <text x="656.7" y="179.0" fill="#2E322F" font-size="11.8" font-weight="400">MetaGPT</text>
  <line x1="656.7" y1="201" x2="910.0" y2="201" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="656.7" y="215.0" fill="#5A554C" font-size="11.2" font-weight="400">上下文共享与写入权限</text>
  <text x="656.7" y="231.0" fill="#2E322F" font-size="11.8" font-weight="400">按角色拆分代理通过消息接力或并行执行后汇总</text>
  <line x1="656.7" y1="253" x2="910.0" y2="253" stroke="#D8D0C0" stroke-width="1" opacity="0.5"/>
  <text x="656.7" y="267.0" fill="#5A554C" font-size="11.2" font-weight="400">工程可靠性与主要瓶颈（2025-06 口径）</text>
  <text x="656.7" y="283.0" fill="#2E322F" font-size="11.8" font-weight="400">❌ 2025 年中上下文传递损耗大、隐式架构假设</text>
  <text x="656.7" y="299.0" fill="#2E322F" font-size="11.8" font-weight="400">频发冲突，跨多代理协调常令复合错误率高于单</text>
  <text x="656.7" y="315.0" fill="#2E322F" font-size="11.8" font-weight="400">代理</text>
  <text x="34.0" y="382.0" fill="#5A554C" font-size="12.2" font-weight="400">依据 Don’t Build Multi-Agents 原文表格自动编译</text>
</svg>
