<script>
(function(){
  var valid={pine:'#f8f7f2',cobalt:'#fafaf8',slate:'#f8fafb',leuchtturm:'#faf7f0'};
  try{
    var t=localStorage.getItem('rw-theme');
    if(!t||!valid[t]) t='pine';
    document.documentElement.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');

  }catch(_e){document.documentElement.setAttribute('data-theme','pine');}
})();

<script>
(function() {
  const THEME_BG = { pine: '#f8f7f2', cobalt: '#fafaf8', slate: '#f8fafb', leuchtturm: '#faf7f0' };
  const btns = [...document.querySelectorAll('[data-set-theme]')];
  function applyTheme(t, persist) {
    const next = THEME_BG[t] ? t : 'pine';
    document.documentElement.setAttribute('data-theme', next);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEME_BG[next]);
    btns.forEach(b => b.setAttribute('aria-pressed', b.getAttribute('data-set-theme') === next ? 'true' : 'false'));
    if (persist) { try { localStorage.setItem('rw-theme', next); } catch (_e) {} }
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'pine', false);
  btns.forEach(b => b.addEventListener('click', () => applyTheme(b.getAttribute('data-set-theme'), true)));

  const DATA = JSON.parse(document.getElementById('factory-data').textContent);
  const svgEl = document.getElementById('factory-svg');
  const drawerEl = document.getElementById('factory-drawer');
  const tickerEl = document.getElementById('wb-ticker');
  const routePillsEl = document.getElementById('wb-route-pills');
  const runSelectEl = document.getElementById('wb-run-select');
  const routeBarEl = document.getElementById('wb-route-bar');
  const playBtn = document.getElementById('wb-play-btn');
  const stepBtn = document.getElementById('wb-step-btn');
  const speedBtn = document.getElementById('wb-speed-btn');
  const resetBtn = document.getElementById('wb-reset-btn');
  const kgPillarsEl = document.getElementById('wb-kg-pillars');
  const kgSvgEl = document.getElementById('wb-kg-svg');
  const kgLegendEl = document.getElementById('wb-kg-legend');
  const kgDrawerEl = document.getElementById('wb-kg-drawer');

  const stationById = new Map((DATA.stations || []).map(s => [s.id, s]));
  const edgeById = new Map((DATA.edges || []).map(e => [e.id, e]));
  const routeById = new Map((DATA.routes || []).map(r => [r.id, r]));

  const state = {
    mode: 'route',
    routeId: (DATA.routes && DATA.routes[0] && DATA.routes[0].id) || 'tg_capture',
    runIndex: 0,
    stepIdx: 0,
    playing: true,
    speed: 1,
    progress: 0,
    selectedStationId: null,
    kgMode: 'hubs',
    kgFocus: null,
  };

  function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tierAccent(tier) {
    if (tier === 'decision1') return 'var(--ink-blue)';
    if (tier === 'policy_md') return 'var(--ink-blue)';
    if (tier === 'storage') return '#8f4310';
    if (tier === 'llm') return 'var(--accent)';
    if (tier === 'human') return '#4c5652';
    return 'var(--ink)';
  }

  function edgePathD(e) {
    const a = stationById.get(e.from);
    const b = stationById.get(e.to);
    if (!a || !b) return '';
    if (e.kind === 'feedback') {
      const x1 = a.x + a.w * 0.5;
      const y1 = a.y + a.h;
      const x2 = b.x + b.w * 0.5;
      const y2 = b.y;
      return `M ${x1} ${y1} C ${x1} 596, ${x2} 596, ${x2} 154 L ${x2} ${y2}`;
    }
    const ax = a.x + a.w;
    const ay = a.y + a.h * 0.5;
    const bx = b.x;
    const by = b.y + b.h * 0.5;
    if (Math.abs(a.x - b.x) < 20) {
      const cx = a.x + a.w * 0.5;
      const yStart = a.y < b.y ? a.y + a.h : a.y;
      const yEnd = a.y < b.y ? b.y : b.y + b.h;
      return `M ${cx} ${yStart} L ${cx} ${yEnd}`;
    }
    if (bx < ax) {
      const mx = (a.x + b.x + b.w) * 0.5;
      return `M ${a.x} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${b.x + b.w} ${by}`;
    }
    const mx = (ax + bx) * 0.5;
    return `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`;
  }

  const edgeSvgRefs = new Map();
  const stationSvgRefs = new Map();
  let mojoChefEl = null;

  function buildBlueprintSvg() {
    const NS = 'http://www.w3.org/2000/svg';
    svgEl.innerHTML = '';

    const defs = document.createElementNS(NS, 'defs');
    const marker = document.createElementNS(NS, 'marker');
    marker.setAttribute('id', 'wb-arrow');
    marker.setAttribute('viewBox', '0 0 8 8');
    marker.setAttribute('refX', '6');
    marker.setAttribute('refY', '4');
    marker.setAttribute('markerWidth', '5');
    marker.setAttribute('markerHeight', '5');
    marker.setAttribute('orient', 'auto-start-reverse');
    const mp = document.createElementNS(NS, 'path');
    mp.setAttribute('d', 'M 0 1 L 7 4 L 0 7 z');
    mp.setAttribute('fill', 'var(--muted)');
    marker.appendChild(mp);
    defs.appendChild(marker);
    svgEl.appendChild(defs);

    const wsLayer = document.createElementNS(NS, 'g');
    (DATA.workshops || []).forEach(ws => {
      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', String(ws.x));
      rect.setAttribute('y', String(ws.y));
      rect.setAttribute('width', String(ws.w));
      rect.setAttribute('height', String(ws.h));
      rect.setAttribute('rx', '3');
      rect.setAttribute('fill', ws.id === 'bus' ? 'var(--paper-alt)' : 'transparent');
      rect.setAttribute('stroke', 'var(--rule)');
      rect.setAttribute('stroke-dasharray', ws.id === 'bus' ? 'none' : '4 4');
      wsLayer.appendChild(rect);

      const lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('x', String(ws.x + 10));
      lbl.setAttribute('y', String(ws.y + 18));
      lbl.setAttribute('font-size', '11');
      lbl.setAttribute('font-family', 'var(--font-mono)');
      lbl.setAttribute('fill', 'var(--muted)');
      lbl.textContent = `${ws.code} ${ws.label}`;
      wsLayer.appendChild(lbl);
    });
    svgEl.appendChild(wsLayer);

    const edgeLayer = document.createElementNS(NS, 'g');
    edgeSvgRefs.clear();
    (DATA.edges || []).forEach(e => {
      const d = edgePathD(e);
      if (!d) return;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('class', 'wb-edge-path' + (e.kind === 'store' ? ' is-store' : ''));
      p.setAttribute('marker-end', 'url(#wb-arrow)');
      edgeLayer.appendChild(p);
      edgeSvgRefs.set(e.id, p);
    });
    svgEl.appendChild(edgeLayer);

    const stLayer = document.createElementNS(NS, 'g');
    stationSvgRefs.clear();
    (DATA.stations || []).forEach(st => {

  function currentSequence() {
    if (state.mode === 'replay') {
      const run = (DATA.runs || [])[state.runIndex] || (DATA.runs || [])[0];
      const steps = (run && run.steps) || [];
      const seq = [];
      for (let i = 0; i < steps.length; i += 1) {
        const cur = steps[i];
        const prev = i > 0 ? steps[i - 1] : null;
        let edgeId = null;
        if (prev && prev.station !== cur.station) {
          const match = (DATA.edges || []).find(e => e.from === prev.station && e.to === cur.station);
          if (match) edgeId = match.id;
        }
        seq.push({
          station: cur.station,
          edge: edgeId,
          action: `${cur.step} · ${cur.summary_text || ''}`,
          duration_ms: cur.duration_ms || 0,
        });
      }
      return {
        title: run ? `${run.trigger} (${run.timestamp || ''})` : '运行回放',
        tag: run ? `${run.status} · ${run.total_ms} ms` : '',
        summary: run && run.counts ? `导读 ${run.counts.blogs ?? '-'} · 主体 ${run.counts.entities ?? '-'}` : '',
        governance: ['gov_schemas', 'gov_decision1'],
        steps: seq,
      };
    }
    const r = routeById.get(state.routeId) || (DATA.routes || [])[0];
    return {
      title: r ? r.label : '',
      tag: r ? r.tag : '',
      summary: r ? r.summary : '',
      governance: (r && r.governance) || [],
      steps: (r && r.steps) || [],
    };
  }

  function refreshSceneVisuals() {
    const seqObj = currentSequence();
    const steps = seqObj.steps || [];
    const activeStations = new Set(steps.map(s => s.station));
    const activeEdges = new Set(steps.map(s => s.edge).filter(Boolean));
    const govSet = new Set(seqObj.governance || []);
    const isOverview = state.mode === 'route' && state.routeId === 'overview';
    const curStep = steps.length ? steps[state.stepIdx % steps.length] : null;

    stationSvgRefs.forEach((g, sid) => {
      const isGov = govSet.has(sid);
      const isCur = curStep && curStep.station === sid;
      const isInRoute = activeStations.has(sid);
      g.classList.toggle('is-selected', state.selectedStationId === sid);
      g.classList.toggle('is-on', Boolean(isCur));
      g.classList.toggle('is-gov-on', isGov);
      g.classList.toggle('is-dim', !isOverview && steps.length > 0 && !isInRoute && !isGov && state.selectedStationId !== sid);
    });

    edgeSvgRefs.forEach((p, eid) => {
      const on = isOverview || activeEdges.has(eid);
      p.classList.toggle('is-active', Boolean(curStep && curStep.edge === eid));
      p.classList.toggle('is-dim', !on);
    });

    if (curStep) {
      const st = stationById.get(curStep.station);
      const durTxt = curStep.duration_ms ? ` · ${curStep.duration_ms} ms` : '';
      tickerEl.innerHTML = `
        <div><span class="wb-ticker-step">[${(state.stepIdx % steps.length) + 1}/${steps.length}] ${escHtml(seqObj.title)}</span> · ${escHtml(st ? st.title : curStep.station)}：${escHtml(curStep.action)}${escHtml(durTxt)}</div>
        <div class="muted" style="font-size:12px;">${escHtml(seqObj.tag)}</div>`;
    } else {
      tickerEl.innerHTML = `
        <div><span class="wb-ticker-step">${escHtml(seqObj.title)}</span> · ${escHtml(seqObj.summary)}</div>
        <div class="muted" style="font-size:12px;">${escHtml(seqObj.tag)}</div>`;
    }
  }

  function truncStr(s, maxLen) {
    const str = String(s || '');

  function ekindColor(kind) {
    if (kind === 'people') return '#4c5652';

  function drawHubsGravitySvg() {
    const NS = 'http://www.w3.org/2000/svg';
    kgSvgEl.setAttribute('viewBox', '0 0 820 520');
    kgSvgEl.innerHTML = '';
    const hubs = (DATA.knowledge_growth?.cross_sector_hubs || []);
    const topHubs = hubs.slice(0, 15);
    const secCountMap = new Map();
    topHubs.forEach(h => (h.sectors || []).forEach(s => secCountMap.set(s, (secCountMap.get(s) || 0) + 1)));
    const sectors = [...secCountMap.entries()].sort((a, b) => b[1] - a[1]);

    const secPos = new Map();
    const secSpan = sectors.length > 1 ? 430 / (sectors.length - 1) : 0;
    sectors.forEach(([sec], idx) => {
      const y = sectors.length === 1 ? 260 : 45 + idx * secSpan;
      secPos.set(sec, y);
    });

    const hubPos = new Map();
    const hubSpan = topHubs.length > 1 ? 454 / (topHubs.length - 1) : 0;
    topHubs.forEach((h, idx) => {
      const y = topHubs.length === 1 ? 260 : 32 + idx * hubSpan;
      hubPos.set(h.title, y);
    });

    const ribbonLayer = makeSvgEl(NS, 'g');
    const secLayer = makeSvgEl(NS, 'g');
    const hubLayer = makeSvgEl(NS, 'g');

    const focus = state.kgFocus;
    const isHubMatched = h => !focus || (focus.type === 'hub' && focus.key === h.title) || (focus.type === 'sector' && (h.sectors || []).includes(focus.key));
    const isSecMatched = sec => {
      if (!focus) return true;
      if (focus.type === 'sector') return focus.key === sec;
      if (focus.type === 'hub') {
        const target = hubs.find(x => x.title === focus.key);
        return Boolean(target && (target.sectors || []).includes(sec));
      }
      return true;
    };

    topHubs.forEach(h => {
      const hy = hubPos.get(h.title);
      (h.sectors || []).forEach(sec => {
        const sy = secPos.get(sec);
        if (sy === undefined || hy === undefined) return;
        const lit = focus && ((focus.type === 'hub' && focus.key === h.title) || (focus.type === 'sector' && focus.key === sec));
        const dim = focus && !lit;
        const path = makeSvgEl(NS, 'path', {
          d: `M 204 ${sy.toFixed(1)} C 350 ${sy.toFixed(1)}, 370 ${hy.toFixed(1)}, 512 ${hy.toFixed(1)}`,
          stroke: ekindColor(h.kind),
          'stroke-width': h.sector_count >= 4 ? '1.6' : '1.1',
          'stroke-opacity': '0.24',
          class: `wb-kg-ribbon${lit ? ' is-lit' : ''}${dim ? ' is-dim' : ''}`,
        });
        ribbonLayer.appendChild(path);
      });
    });

    sectors.forEach(([sec, cnt]) => {
      const sy = secPos.get(sec);
      const matched = isSecMatched(sec);
      const lit = focus && focus.type === 'sector' && focus.key === sec;
      const g = makeSvgEl(NS, 'g', { class: `wb-kg-svg-item${lit ? ' is-lit' : ''}${focus && !matched ? ' is-dim' : ''}` });
      g.appendChild(makeSvgEl(NS, 'rect', { x: 16, y: sy - 14, width: 188, height: 28, rx: 3, fill: lit ? 'var(--highlight)' : 'var(--paper)', stroke: lit ? 'var(--accent)' : 'var(--rule-strong)', 'stroke-width': lit ? '1.6' : '1' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 26, y: sy + 4, 'font-size': 12.5, 'font-family': 'var(--font-sans)', fill: 'var(--ink)' }, truncStr(sec, 10)));
      g.appendChild(makeSvgEl(NS, 'text', { x: 194, y: sy + 4, 'font-size': 11, 'font-family': 'var(--font-mono)', 'text-anchor': 'end', fill: 'var(--ink-blue)' }, `${cnt} 枢纽`));
      g.addEventListener('click', () => {
        state.kgFocus = (focus && focus.type === 'sector' && focus.key === sec) ? null : { type: 'sector', key: sec };
        renderKnowledgeView();
      });
      secLayer.appendChild(g);
    });

    const maxW = Math.max(1, ...topHubs.map(h => h.weight || 1));
    topHubs.forEach(h => {
      const hy = hubPos.get(h.title);
      const matched = isHubMatched(h);
      const lit = focus && focus.type === 'hub' && focus.key === h.title;
      const r = 4.2 + 3.8 * Math.sqrt((h.weight || 1) / maxW);
      const g = makeSvgEl(NS, 'g', { class: `wb-kg-svg-item${lit ? ' is-lit' : ''}${focus && !matched ? ' is-dim' : ''}` });
      g.appendChild(makeSvgEl(NS, 'rect', { class: 'wb-kg-row-bg', x: 512, y: hy - 14, width: 292, height: 28, rx: 3, stroke: lit ? 'var(--accent)' : 'transparent', 'stroke-width': '1' }));
      g.appendChild(makeSvgEl(NS, 'circle', { cx: 526, cy: hy, r: r.toFixed(1), fill: ekindColor(h.kind), stroke: 'var(--paper)', 'stroke-width': '1' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 540, y: hy + 4, 'font-size': 12, 'font-family': 'var(--font-sans)', fill: 'var(--ink)' }, truncStr(h.title, 18)));

  function drawBridgesStackSvg() {
    const NS = 'http://www.w3.org/2000/svg';
    kgSvgEl.setAttribute('viewBox', '0 0 820 520');
    kgSvgEl.innerHTML = '';
    const bridges = (DATA.knowledge_growth?.bridges || []).slice(0, 10);
    const stackEnts = (DATA.knowledge_growth?.stack_entities || []).slice(0, 5);
    const maxLinks = Math.max(1, ...bridges.map(b => b.totalLinks || 1));
    const focus = state.kgFocus;

    kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: 18, y: 24, 'font-size': 11.5, 'font-family': 'var(--font-mono)', fill: 'var(--muted)' }, '跨主题桥梁 Top 10（左：正文互引 · 右：主次共现）'));

    bridges.forEach((b, idx) => {
      const cy = 48 + idx * 30;
      const bKey = `${b.sector}|${b.fromLabel}|${b.toLabel}`;
      const lit = focus && focus.type === 'bridge' && focus.key === bKey;
      const dim = focus && !lit;
      const g = makeSvgEl(NS, 'g', { class: `wb-kg-svg-item${lit ? ' is-lit' : ''}${dim ? ' is-dim' : ''}` });
      g.appendChild(makeSvgEl(NS, 'rect', { class: 'wb-kg-row-bg', x: 14, y: cy - 13, width: 792, height: 26, rx: 3, stroke: lit ? 'var(--accent)' : 'transparent', 'stroke-width': '1' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 242, y: cy + 4, 'font-size': 11.5, 'font-family': 'var(--font-sans)', 'text-anchor': 'end', fill: 'var(--ink)' }, truncStr(b.fromLabel, 13)));

      const totalW = Math.max(14, (b.totalLinks / maxLinks) * 186);
      const citeW = b.totalLinks > 0 ? totalW * (b.citeCount / b.totalLinks) : 0;
      const coocW = Math.max(0, totalW - citeW);
      g.appendChild(makeSvgEl(NS, 'rect', { x: 256, y: cy - 6, width: 186, height: 12, rx: 2, fill: 'var(--paper-alt)', stroke: 'var(--rule)' }));
      if (citeW > 0.5) g.appendChild(makeSvgEl(NS, 'rect', { x: 256, y: cy - 6, width: citeW.toFixed(1), height: 12, rx: 1, fill: 'var(--accent)' }));
      if (coocW > 0.5) g.appendChild(makeSvgEl(NS, 'rect', { x: (256 + citeW).toFixed(1), y: cy - 6, width: coocW.toFixed(1), height: 12, rx: 1, fill: 'var(--ink-blue)' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 450, y: cy + 4, 'font-size': 10.5, 'font-family': 'var(--font-mono)', fill: 'var(--ink-body)' }, String(b.totalLinks)));

      g.appendChild(makeSvgEl(NS, 'text', { x: 484, y: cy + 4, 'font-size': 11.5, 'font-family': 'var(--font-sans)', fill: 'var(--ink)' }, truncStr(b.toLabel, 13)));
      g.appendChild(makeSvgEl(NS, 'text', { x: 798, y: cy + 4, 'font-size': 10.5, 'font-family': 'var(--font-mono)', 'text-anchor': 'end', fill: 'var(--muted)' }, `${sectorShortName(b.sector)} · ${b.articleCount}篇`));
      g.addEventListener('click', () => {
        state.kgFocus = (focus && focus.type === 'bridge' && focus.key === bKey) ? null : { type: 'bridge', key: bKey };
        renderKnowledgeView();
      });
      kgSvgEl.appendChild(g);
    });

    kgSvgEl.appendChild(makeSvgEl(NS, 'line', { x1: 18, y1: 354, x2: 802, y2: 354, stroke: 'var(--rule-strong)', 'stroke-dasharray': '4 3' }));
    kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: 18, y: 374, 'font-size': 11.5, 'font-family': 'var(--font-mono)', fill: 'var(--muted)' }, `多工程层主干（≥2 层技术栈 · ${stackEnts.length} 家）`));

    const layerSet = [];
    stackEnts.forEach(s => (s.layerIds || []).forEach(lid => { if (!layerSet.includes(lid)) layerSet.push(lid); }));
    const layers = layerSet.length ? layerSet.slice(0, 6) : ['L1', 'L2', 'L3', 'L4', 'L5', 'L6'];
    const colStart = 216;
    const colStep = layers.length > 1 ? 470 / (layers.length - 1) : 0;
    const layerX = new Map();
    layers.forEach((lid, i) => {
      const lx = colStart + i * colStep;
      layerX.set(lid, lx);
      kgSvgEl.appendChild(makeSvgEl(NS, 'line', { x1: lx, y1: 386, x2: lx, y2: 500, stroke: 'var(--rule)', 'stroke-dasharray': '2 3' }));
      kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: lx, y: 396, 'font-size': 10.5, 'font-family': 'var(--font-mono)', 'text-anchor': 'middle', fill: 'var(--ink-blue)' }, truncStr(lid, 8)));
    });

    stackEnts.forEach((s, idx) => {
      const ry = 418 + idx * 20;
      const sKey = `${s.sector}|${s.entity}`;
      const lit = focus && focus.type === 'stack' && focus.key === sKey;
      const dim = focus && !lit;
      const g = makeSvgEl(NS, 'g', { class: `wb-kg-svg-item${lit ? ' is-lit' : ''}${dim ? ' is-dim' : ''}` });
      g.appendChild(makeSvgEl(NS, 'rect', { class: 'wb-kg-row-bg', x: 14, y: ry - 10, width: 792, height: 19, rx: 3, stroke: lit ? 'var(--accent)' : 'transparent', 'stroke-width': '1' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 186, y: ry + 4, 'font-size': 11.5, 'font-family': 'var(--font-sans)', 'text-anchor': 'end', fill: 'var(--ink)' }, truncStr(s.entity, 14)));
      const xs = (s.layerIds || []).map(id => layerX.get(id)).filter(x => x !== undefined).sort((a, b) => a - b);
      if (xs.length >= 2) {
        g.appendChild(makeSvgEl(NS, 'line', { x1: xs[0], y1: ry, x2: xs[xs.length - 1], y2: ry, stroke: lit ? 'var(--accent)' : 'var(--ink-blue)', 'stroke-width': '2' }));
      }
      xs.forEach(px => {
        g.appendChild(makeSvgEl(NS, 'circle', { cx: px, cy: ry, r: 4.2, fill: 'var(--accent)', stroke: 'var(--paper)', 'stroke-width': '1.2' }));
      });
      g.appendChild(makeSvgEl(NS, 'text', { x: 798, y: ry + 4, 'font-size': 10.5, 'font-family': 'var(--font-mono)', 'text-anchor': 'end', fill: 'var(--muted)' }, `${s.layersCount}层 · ${s.claimCount}条`));
      g.addEventListener('click', () => {
        state.kgFocus = (focus && focus.type === 'stack' && focus.key === sKey) ? null : { type: 'stack', key: sKey };
        renderKnowledgeView();
      });
      kgSvgEl.appendChild(g);
    });

    if (kgLegendEl) {
      kgLegendEl.innerHTML =
        '<span><span class="wb-legend-dot" style="background:var(--accent);"></span>正文互引 / 工程层节点</span>'
        + '<span><span class="wb-legend-dot" style="background:var(--ink-blue);"></span>主次主题共现</span>'
        + '<span style="margin-left:auto;font-family:var(--font-mono);">点击任意桥梁或工程主干查看细分文章数</span>';
    }
  }

  function drawEvolutionTensionSvg() {
    const NS = 'http://www.w3.org/2000/svg';
    const theses = DATA.knowledge_growth?.theses || [];
    const h = Math.max(520, 48 + theses.length * 20);
    kgSvgEl.setAttribute('viewBox', `0 0 820 ${h}`);
    kgSvgEl.innerHTML = '';

    const axisX = 500;
    const maxNeg = Math.max(1, ...theses.map(t => (t.refute || 0) + (t.revised || 0)));
    const maxPos = Math.max(1, ...theses.map(t => t.support || 0));
    const negScale = 128 / maxNeg;
    const posScale = 236 / maxPos;
    const focus = state.kgFocus;

    kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: 16, y: 20, 'font-size': 11, 'font-family': 'var(--font-mono)', fill: 'var(--muted)' }, '赛道 · 核心判断'));
    kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: axisX - 8, y: 20, 'font-size': 11, 'font-family': 'var(--font-mono)', 'text-anchor': 'end', fill: '#8f4310' }, '← 反证 / 修正旧错'));
    kgSvgEl.appendChild(makeSvgEl(NS, 'text', { x: axisX + 8, y: 20, 'font-size': 11, 'font-family': 'var(--font-mono)', fill: 'var(--accent)' }, '支撑证据 →'));
    kgSvgEl.appendChild(makeSvgEl(NS, 'line', { x1: axisX, y1: 28, x2: axisX, y2: h - 10, stroke: 'var(--rule-strong)', 'stroke-dasharray': '3 3' }));

    theses.forEach((th, idx) => {
      const ry = 40 + idx * 20;
      const tKey = `${th.sector}|${th.id}`;
      const lit = focus && focus.type === 'thesis' && focus.key === tKey;
      const dim = focus && !lit;
      const g = makeSvgEl(NS, 'g', { class: `wb-kg-svg-item${lit ? ' is-lit' : ''}${dim ? ' is-dim' : ''}` });
      g.appendChild(makeSvgEl(NS, 'rect', { class: 'wb-kg-row-bg', x: 10, y: ry - 10, width: 800, height: 19, rx: 2, stroke: lit ? 'var(--accent)' : 'transparent', 'stroke-width': '1' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: 16, y: ry + 4, 'font-size': 10.5, 'font-family': 'var(--font-mono)', fill: 'var(--ink-blue)' }, `${sectorShortName(th.sector)}·${th.id}`));
      g.appendChild(makeSvgEl(NS, 'text', { x: 74, y: ry + 4, 'font-size': 11.5, 'font-family': 'var(--font-sans)', fill: 'var(--ink)' }, truncStr(th.title, 20)));

      const revW = (th.revised || 0) * negScale;
      const refW = (th.refute || 0) * negScale;
      if (revW > 0) g.appendChild(makeSvgEl(NS, 'rect', { x: (axisX - revW).toFixed(1), y: ry - 5, width: revW.toFixed(1), height: 10, fill: '#8f4310' }));
      if (refW > 0) g.appendChild(makeSvgEl(NS, 'rect', { x: (axisX - revW - refW).toFixed(1), y: ry - 5, width: refW.toFixed(1), height: 10, fill: 'var(--ink-blue)' }));
      const negTot = (th.revised || 0) + (th.refute || 0);
      if (negTot > 0) {
        g.appendChild(makeSvgEl(NS, 'text', { x: (axisX - revW - refW - 5).toFixed(1), y: ry + 4, 'font-size': 10, 'font-family': 'var(--font-mono)', 'text-anchor': 'end', fill: '#8f4310' }, `-${negTot}`));
      }

      const supW = (th.support || 0) * posScale;
      if (supW > 0) g.appendChild(makeSvgEl(NS, 'rect', { x: axisX, y: ry - 5, width: supW.toFixed(1), height: 10, fill: 'var(--accent)' }));
      g.appendChild(makeSvgEl(NS, 'text', { x: (axisX + supW + 6).toFixed(1), y: ry + 4, 'font-size': 10, 'font-family': 'var(--font-mono)', fill: 'var(--muted)' }, `+${th.support}${th.revised ? ` · 修${th.revised}` : ''}`));

      g.addEventListener('click', () => {
        state.kgFocus = (focus && focus.type === 'thesis' && focus.key === tKey) ? null : { type: 'thesis', key: tKey };
        renderKnowledgeView();
      });
      kgSvgEl.appendChild(g);
    });

    if (kgLegendEl) {
      kgLegendEl.innerHTML =
        '<span><span class="wb-legend-dot" style="background:var(--accent);"></span>支撑证据</span>'
        + '<span><span class="wb-legend-dot" style="background:var(--ink-blue);"></span>反证边界</span>'
        + '<span><span class="wb-legend-dot" style="background:#8f4310;"></span>已修正旧错</span>'
        + '<span style="margin-left:auto;font-family:var(--font-mono);">点击任意判断行查看具体修正了哪些旧误判</span>';
    }
  }

  function svgAppendAll(parent, nodes) {
    nodes.forEach(n => parent.appendChild(n));
  }

          <div class="wb-drawer-scroll">

      kgDrawerEl.innerHTML = `

            ${thRevs.length ? `<div class="wb-subhead">已修正旧错（${thRevs.length}）</div>${thRevs.map(r => `<div class="wb-file-row"><div class="wb-file-path">${escHtml(r.node_title)}</div>${r.node_sub ? `<div class="wb-file-meta">${escHtml(r.node_sub)}</div>` : ''}</div>`).join('')}` : ''}
            ${thRefs.length ? `<div class="wb-subhead">反证与边界（${thRefs.length}）</div>${thRefs.map(r => `<div class="wb-file-row"><div class="wb-file-path">${escHtml(r.node_title)}</div>${r.node_sub ? `<div class="wb-file-meta">${escHtml(r.node_sub)}</div>` : ''}</div>`).join('')}` : ''}
            <div class="wb-file-row"><a href="${escHtml(th.href)}" style="color:var(--accent);font-size:12.5px;">在赛道脉络树中查看完整证据链 ↗</a></div>
          </div>`;
        bindKgDrawerActions();
        return;
      }
    }

    const highTension = [...theses].sort((a, b) => (b.revised + b.refute) - (a.revised + a.refute) || b.support - a.support).slice(0, 8);
    kgDrawerEl.innerHTML = `
      <div class="wb-drawer-head">
        <div>
          <h3 class="wb-drawer-title">张力最高判断 & 最新修正（${revs.length} 条）</h3>
          <div class="wb-drawer-sub">按「反证 + 修正旧错」密度排序，点击左侧条形查看详情</div>
        </div>
      </div>
      <div class="wb-drawer-scroll">
        <div class="wb-subhead">高频修正 / 反证判断</div>
        ${highTension.map(th => `
          <div class="wb-file-row">
            <div class="wb-file-path"><button type="button" class="pnp-row-btn" data-kg-pick="thesis:${escHtml(`${th.sector}|${th.id}`)}">${escHtml(th.sector)}·${escHtml(th.id)}：${escHtml(truncStr(th.title, 26))}</button></div>
            <div class="wb-file-meta">支 ${th.support} · 反 ${th.refute} · 修 ${th.revised}</div>
          </div>`).join('')}
      </div>`;
    bindKgDrawerActions();
  }

  function bindKgDrawerActions() {
    document.getElementById('wb-kg-back')?.addEventListener('click', () => {
      state.kgFocus = null;
      renderKnowledgeView();
    });
    kgDrawerEl.querySelectorAll('[data-kg-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        const raw = btn.getAttribute('data-kg-pick') || '';
        const sep = raw.indexOf(':');
        if (sep > 0) {
          state.kgFocus = { type: raw.slice(0, sep), key: raw.slice(sep + 1) };
          renderKnowledgeView();
        }
      });
    });
  }

  function renderKnowledgeView() {
    renderKnowledgePillars();
    if (kgSvgEl) {
      if (state.kgMode === 'bridges') drawBridgesStackSvg();
      else if (state.kgMode === 'evolution') drawEvolutionTensionSvg();
      else drawHubsGravitySvg();
    }
    renderKgDrawer();
  }

  function populateRouteAndRunControls() {
    routePillsEl.innerHTML = (DATA.routes || []).map(r =>
      `<button type="button" class="wb-route-btn${r.id === state.routeId ? ' is-active' : ''}" data-rid="${escHtml(r.id)}">${escHtml(r.label)}</button>`
    ).join('');
    routePillsEl.querySelectorAll('[data-rid]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.routeId = btn.getAttribute('data-rid');
        state.stepIdx = 0;
        state.progress = 0;
        state.playing = state.routeId !== 'overview';
        playBtn.textContent = state.playing ? '暂停' : '播放';
        routePillsEl.querySelectorAll('[data-rid]').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-rid') === state.routeId));
        refreshSceneVisuals();
      });
    });

    runSelectEl.innerHTML = (DATA.runs || []).map((r, i) =>
      `<option value="${i}">${escHtml(r.timestamp)} · ${escHtml(r.trigger)} (${r.total_ms} ms)</option>`
    ).join('');
    runSelectEl.addEventListener('change', () => {
      state.runIndex = Number(runSelectEl.value || '0');
      state.stepIdx = 0;
      state.progress = 0;
      state.playing = true;
      playBtn.textContent = '暂停';
      refreshSceneVisuals();
    });
  }

  function setMode(nextMode, runIdx) {
    state.mode = nextMode;
    if (typeof runIdx === 'number') state.runIndex = runIdx;
    state.stepIdx = 0;
    state.progress = 0;
    state.playing = true;
    playBtn.textContent = '暂停';
    document.getElementById('mode-route-btn')?.classList.toggle('is-active', state.mode === 'route');
    document.getElementById('mode-replay-btn')?.classList.toggle('is-active', state.mode === 'replay');
    routeBarEl.style.display = state.mode === 'route' ? 'flex' : 'none';
    runSelectEl.style.display = state.mode === 'replay' ? 'inline-block' : 'none';
    if (state.mode === 'replay') runSelectEl.value = String(state.runIndex);
    refreshSceneVisuals();
  }

  document.getElementById('mode-route-btn')?.addEventListener('click', () => setMode('route'));
  document.getElementById('mode-replay-btn')?.addEventListener('click', () => setMode('replay', state.runIndex));
  playBtn?.addEventListener('click', () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? '暂停' : '播放';
  });
  stepBtn?.addEventListener('click', () => {
    const steps = currentSequence().steps || [];
    if (!steps.length) return;
    state.playing = false;
    playBtn.textContent = '播放';
    state.stepIdx = (state.stepIdx + 1) % steps.length;
    state.progress = 0;
    refreshSceneVisuals();
  });
  speedBtn?.addEventListener('click', () => {
    state.speed = state.speed === 1 ? 2 : 1;
    speedBtn.textContent = `${state.speed}x`;
  });
  resetBtn?.addEventListener('click', () => {
    state.stepIdx = 0;
    state.progress = 0;
    state.selectedStationId = null;
    state.playing = state.mode === 'replay' || state.routeId !== 'overview';
    playBtn.textContent = state.playing ? '暂停' : '播放';
    renderDrawer();
    refreshSceneVisuals();
  });

  let lastTs = 0;
  function animateFrame(ts) {
    if (!lastTs) lastTs = ts;
    const dtSec = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;

    const seqObj = currentSequence();
    const steps = seqObj.steps || [];
    if (steps.length) {
      if (state.playing) {
        state.progress += dtSec * 0.72 * state.speed;
        if (state.progress >= 1) {
          state.progress = 0;
          state.stepIdx = (state.stepIdx + 1) % steps.length;
          refreshSceneVisuals();
        }
      }
      const cur = steps[state.stepIdx % steps.length];
      const ep = cur.edge ? edgeSvgRefs.get(cur.edge) : null;
      const bob = state.playing ? Math.sin(ts / 140) * 1.8 : 0;
      if (ep && ep.getTotalLength) {
        const len = ep.getTotalLength();
        const pt = ep.getPointAtLength(len * Math.min(1, Math.max(0, state.progress)));
        mojoChefEl.setAttribute('transform', `translate(${pt.x.toFixed(1)}, ${(pt.y + bob).toFixed(1)})`);
        mojoChefEl.style.display = 'block';
      } else {
        const st = stationById.get(cur.station);
        if (st) {
          const cx = st.x + st.w * 0.5;
          const cy = st.y + st.h * 0.5 + bob;
          mojoChefEl.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);
          mojoChefEl.style.display = 'block';
        }
      }
    } else {
      mojoChefEl.style.display = 'none';
    }
    requestAnimationFrame(animateFrame);
  }

  buildBlueprintSvg();
  populateRouteAndRunControls();
  renderDrawer();
  renderKnowledgeView();
  refreshSceneVisuals();
  requestAnimationFrame(animateFrame);
})();
</script>
</body>
</html>
