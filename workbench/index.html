<script>
(function() {
  const THEME_BG = { pine: '#f8f7f2', cobalt: '#fafaf8', slate: '#f8fafb', leuchtturm: '#faf7f0' };
  const btns = [...document.querySelectorAll('[data-set-theme]')];
  function applyTheme(t, persist) {
    const next = THEME_BG[t] ? t : 'pine';
    document.documentElement.setAttribute('data-theme', next);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', THEME_BG[next]);
    btns.forEach(b => b.setAttribute('aria-pressed', b.getAttribute('data-set-theme') === next ? 'true' : 'false'));
    if (persist) { try { localStorage.setItem('rw-theme', next); } catch (_e) {} }
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'pine', false);
  btns.forEach(b => b.addEventListener('click', () => applyTheme(b.getAttribute('data-set-theme'), true)));

  const DATA = JSON.parse(document.getElementById('factory-data').textContent);
  const svgEl = document.getElementById('factory-svg');
  const drawerEl = document.getElementById('factory-drawer');
  const tickerEl = document.getElementById('wb-ticker');
  const routePillsEl = document.getElementById('wb-route-pills');
  const runSelectEl = document.getElementById('wb-run-select');
  const routeBarEl = document.getElementById('wb-route-bar');
  const playBtn = document.getElementById('wb-play-btn');
  const stepBtn = document.getElementById('wb-step-btn');
  const speedBtn = document.getElementById('wb-speed-btn');
  const resetBtn = document.getElementById('wb-reset-btn');
  const invGridEl = document.getElementById('wb-inv-grid');

  const stationById = new Map((DATA.stations || []).map(s => [s.id, s]));
  const edgeById = new Map((DATA.edges || []).map(e => [e.id, e]));
  const routeById = new Map((DATA.routes || []).map(r => [r.id, r]));

  const state = {
    mode: 'route',
    routeId: (DATA.routes && DATA.routes[0] && DATA.routes[0].id) || 'tg_capture',
    runIndex: 0,
    stepIdx: 0,
    playing: true,
    speed: 1,
    progress: 0,
    selectedStationId: null,
    invKind: 'all',
  };

  function escHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function tierAccent(tier) {
    if (tier === 'decision1') return 'var(--ink-blue)';
    if (tier === 'policy_md') return 'var(--ink-blue)';
    if (tier === 'storage') return '#8f4310';
    if (tier === 'llm') return 'var(--accent)';
    if (tier === 'human') return '#4c5652';
    return 'var(--ink)';
  }

  function edgePathD(e) {
    const a = stationById.get(e.from);
    const b = stationById.get(e.to);
    if (!a || !b) return '';
    if (e.kind === 'feedback') {
      const x1 = a.x + a.w * 0.5;
      const y1 = a.y + a.h;
      const x2 = b.x + b.w * 0.5;
      const y2 = b.y;
      return `M ${x1} ${y1} C ${x1} 596, ${x2} 596, ${x2} 154 L ${x2} ${y2}`;
    }
    const ax = a.x + a.w;
    const ay = a.y + a.h * 0.5;
    const bx = b.x;
    const by = b.y + b.h * 0.5;
    if (Math.abs(a.x - b.x) < 20) {
      const cx = a.x + a.w * 0.5;
      const yStart = a.y < b.y ? a.y + a.h : a.y;
      const yEnd = a.y < b.y ? b.y : b.y + b.h;
      return `M ${cx} ${yStart} L ${cx} ${yEnd}`;
    }
    if (bx < ax) {
      const mx = (a.x + b.x + b.w) * 0.5;
      return `M ${a.x} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${b.x + b.w} ${by}`;
    }
    const mx = (ax + bx) * 0.5;
    return `M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`;
  }

    addEl('rect', { x: -4.2, y: -7.1, width: 8.4, height: 1.6, fill: '#ffffff', 'fill-opacity': '0.9' });

    tokenLayer.appendChild(mojoChefEl);

  function currentSequence() {
    if (state.mode === 'replay') {
      const run = (DATA.runs || [])[state.runIndex] || (DATA.runs || [])[0];
      const steps = (run && run.steps) || [];
      const seq = [];
      for (let i = 0; i < steps.length; i += 1) {
        const cur = steps[i];
        const prev = i > 0 ? steps[i - 1] : null;
        let edgeId = null;
        if (prev && prev.station !== cur.station) {
          const match = (DATA.edges || []).find(e => e.from === prev.station && e.to === cur.station);
          if (match) edgeId = match.id;
        }
        seq.push({
          station: cur.station,
          edge: edgeId,
          action: `${cur.step} · ${cur.summary_text || ''}`,
          duration_ms: cur.duration_ms || 0,
        });
      }
      return {
        title: run ? `${run.trigger} (${run.timestamp || ''})` : '运行回放',
        tag: run ? `${run.status} · ${run.total_ms} ms` : '',
        summary: run && run.counts ? `导读 ${run.counts.blogs ?? '-'} · 主体 ${run.counts.entities ?? '-'}` : '',
        governance: ['gov_schemas', 'gov_decision1'],
        steps: seq,
      };
    }
    const r = routeById.get(state.routeId) || (DATA.routes || [])[0];
    return {
      title: r ? r.label : '',
      tag: r ? r.tag : '',
      summary: r ? r.summary : '',
      governance: (r && r.governance) || [],
      steps: (r && r.steps) || [],
    };
  }

  function refreshSceneVisuals() {
    const seqObj = currentSequence();
    const steps = seqObj.steps || [];
    const activeStations = new Set(steps.map(s => s.station));
    const activeEdges = new Set(steps.map(s => s.edge).filter(Boolean));
    const govSet = new Set(seqObj.governance || []);
    const isOverview = state.mode === 'route' && state.routeId === 'overview';
    const curStep = steps.length ? steps[state.stepIdx % steps.length] : null;

    stationSvgRefs.forEach((g, sid) => {
      const isGov = govSet.has(sid);
      const isCur = curStep && curStep.station === sid;
      const isInRoute = activeStations.has(sid);
      g.classList.toggle('is-selected', state.selectedStationId === sid);
      g.classList.toggle('is-on', Boolean(isCur));
      g.classList.toggle('is-gov-on', isGov);
      g.classList.toggle('is-dim', !isOverview && steps.length > 0 && !isInRoute && !isGov && state.selectedStationId !== sid);
    });

    edgeSvgRefs.forEach((p, eid) => {
      const on = isOverview || activeEdges.has(eid);
      p.classList.toggle('is-active', Boolean(curStep && curStep.edge === eid));
      p.classList.toggle('is-dim', !on);
    });

    if (curStep) {
      const st = stationById.get(curStep.station);
      const durTxt = curStep.duration_ms ? ` · ${curStep.duration_ms} ms` : '';
      tickerEl.innerHTML = `
        <div><span class="wb-ticker-step">[${(state.stepIdx % steps.length) + 1}/${steps.length}] ${escHtml(seqObj.title)}</span> · ${escHtml(st ? st.title : curStep.station)}：${escHtml(curStep.action)}${escHtml(durTxt)}</div>
        <div class="muted" style="font-size:12px;">${escHtml(seqObj.tag)}</div>`;
    } else {
      tickerEl.innerHTML = `
        <div><span class="wb-ticker-step">${escHtml(seqObj.title)}</span> · ${escHtml(seqObj.summary)}</div>
        <div class="muted" style="font-size:12px;">${escHtml(seqObj.tag)}</div>`;
    }
  }

  function selectStation(sid) {
    state.selectedStationId = sid;
    renderDrawer();
    refreshSceneVisuals();
  }

  function renderDrawer() {
    const st = state.selectedStationId ? stationById.get(state.selectedStationId) : null;
    if (!st) {

        </div>`).join('');
      const astRows = (DATA.ast_edges || []).slice(0, 8).map(ae => `
        <button type="button" class="wb-chip-btn" data-jump-station="${escHtml(ae.to)}">${escHtml((stationById.get(ae.from)||{}).title || ae.from)} → ${escHtml((stationById.get(ae.to)||{}).title || ae.to)}</button>
      `).join('');
      drawerEl.innerHTML = `
        <div class="wb-drawer-head">
          <div>
            <h3 class="wb-drawer-title">全厂运行快照与工位索引</h3>
            <div class="wb-drawer-sub">${DATA.stations.length} 个工位 · ${DATA.ast_edges.length} 条自动扫描模块调用链</div>
          </div>
        </div>
        <div class="wb-drawer-scroll">
          ${latestRun ? `<div class="wb-subhead">最近一次出厂流水（${escHtml(latestRun.timestamp)}）</div>
          <div class="wb-file-row"><div class="wb-file-path">${escHtml(latestRun.trigger)} · ${escHtml(latestRun.status)} · ${latestRun.total_ms} ms</div>
          <div class="wb-file-meta">含 ${(latestRun.steps || []).length} 个工步记录</div></div>` : ''}
          <div class="wb-subhead">最近运行历史</div>
          ${topRuns}
          ${astRows ? `<div class="wb-subhead">AST 自动扫描模块依赖样本</div><div class="wb-chip-wrap">${astRows}</div>` : ''}
        </div>`;
      bindDrawerActions();
      return;
    }

    const upEdges = (DATA.edges || []).filter(e => e.to === st.id);
    const downEdges = (DATA.edges || []).filter(e => e.from === st.id);
    const filesHtml = (st.files || []).map(f => `
      <div class="wb-file-row">
        <div class="wb-file-path">${escHtml(f.path)}</div>
        <div class="wb-file-meta">${escHtml(f.kindLabel)}${f.lines ? ` · ${f.lines} 行` : ''}${f.mtime ? ` · 更新 ${escHtml(f.mtime)}` : ''}</div>
        ${f.summary ? `<div class="wb-file-meta">${escHtml(f.summary)}</div>` : ''}
        ${(f.commands && f.commands.length) ? `<div class="wb-file-meta">CLI：${escHtml(f.commands.join(', '))}</div>` : ''}
      </div>`).join('');

    const upHtml = upEdges.map(e => `<button type="button" class="wb-chip-btn" data-jump-station="${escHtml(e.from)}">← ${escHtml((stationById.get(e.from)||{}).title || e.from)} (${escHtml(e.label)})</button>`).join('');
    const downHtml = downEdges.map(e => `<button type="button" class="wb-chip-btn" data-jump-station="${escHtml(e.to)}">${escHtml((stationById.get(e.to)||{}).title || e.to)} → (${escHtml(e.label)})</button>`).join('');

    const runHistory = (DATA.runs || []).slice(0, 5).flatMap(r =>
      (r.steps || []).filter(s => s.station === st.id).map(s => `
        <div class="wb-file-row">
          <div class="wb-file-path">${escHtml(s.step)} · ${s.duration_ms} ms</div>
          <div class="wb-file-meta">${escHtml(r.timestamp)} · ${escHtml(s.summary_text)}</div>
        </div>`)
    ).join('');

    drawerEl.innerHTML = `
      <div class="wb-drawer-head">
        <div>
          <h3 class="wb-drawer-title">${escHtml(st.title)}</h3>
          <div class="wb-drawer-sub">${escHtml(st.tierLabel)} · ${escHtml(st.subtitle)}</div>
        </div>
        <button type="button" class="btn-secondary" id="wb-drawer-back">← 总览</button>
      </div>
      <div class="wb-drawer-scroll">
        <div class="wb-file-row">
          <div class="wb-file-path">${escHtml(st.role)}</div>
          <div class="wb-file-meta">${escHtml(st.io)}</div>
        </div>
        ${upHtml || downHtml ? `<div class="wb-subhead">上下游连接</div><div class="wb-chip-wrap">${upHtml}${downHtml}</div>` : ''}
        <div class="wb-subhead">管辖代码 / 规则 .md / 状态文件（${(st.files || []).length}）</div>
        ${filesHtml || '<div class="wb-file-meta">暂无扫描文件</div>'}
        ${runHistory ? `<div class="wb-subhead">最近实测耗时与产出</div>${runHistory}` : ''}
      </div>`;
    bindDrawerActions();
  }

  function bindDrawerActions() {
    document.getElementById('wb-drawer-back')?.addEventListener('click', () => selectStation(null));
    drawerEl.querySelectorAll('[data-jump-station]').forEach(btn => {
      btn.addEventListener('click', () => selectStation(btn.getAttribute('data-jump-station')));
    });
    drawerEl.querySelectorAll('[data-jump-run]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.getAttribute('data-jump-run') || '0');
        setMode('replay', idx);
      });

  }

  function renderInventory() {
    const list = (DATA.inventory || []).filter(it => state.invKind === 'all' || it.kind === state.invKind);
    invGridEl.innerHTML = list.map(it => `
      <div class="wb-inv-card">

    invGridEl.querySelectorAll('[data-focus-st]').forEach(btn => {

  function populateRouteAndRunControls() {
    routePillsEl.innerHTML = (DATA.routes || []).map(r =>
      `<button type="button" class="wb-route-btn${r.id === state.routeId ? ' is-active' : ''}" data-rid="${escHtml(r.id)}">${escHtml(r.label)}</button>`
    ).join('');
    routePillsEl.querySelectorAll('[data-rid]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.routeId = btn.getAttribute('data-rid');
        state.stepIdx = 0;
        state.progress = 0;
        state.playing = state.routeId !== 'overview';
        playBtn.textContent = state.playing ? '暂停' : '播放';
        routePillsEl.querySelectorAll('[data-rid]').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-rid') === state.routeId));
        refreshSceneVisuals();
      });
    });

    runSelectEl.innerHTML = (DATA.runs || []).map((r, i) =>
      `<option value="${i}">${escHtml(r.timestamp)} · ${escHtml(r.trigger)} (${r.total_ms} ms)</option>`
    ).join('');
    runSelectEl.addEventListener('change', () => {
      state.runIndex = Number(runSelectEl.value || '0');
      state.stepIdx = 0;
      state.progress = 0;
      state.playing = true;
      playBtn.textContent = '暂停';
      refreshSceneVisuals();
    });
  }

  function setMode(nextMode, runIdx) {
    state.mode = nextMode;
    if (typeof runIdx === 'number') state.runIndex = runIdx;
    state.stepIdx = 0;
    state.progress = 0;
    state.playing = true;
    playBtn.textContent = '暂停';
    document.getElementById('mode-route-btn')?.classList.toggle('is-active', state.mode === 'route');
    document.getElementById('mode-replay-btn')?.classList.toggle('is-active', state.mode === 'replay');
    routeBarEl.style.display = state.mode === 'route' ? 'flex' : 'none';
    runSelectEl.style.display = state.mode === 'replay' ? 'inline-block' : 'none';
    if (state.mode === 'replay') runSelectEl.value = String(state.runIndex);
    refreshSceneVisuals();
  }

  document.getElementById('mode-route-btn')?.addEventListener('click', () => setMode('route'));
  document.getElementById('mode-replay-btn')?.addEventListener('click', () => setMode('replay', state.runIndex));
  playBtn?.addEventListener('click', () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? '暂停' : '播放';
  });
  stepBtn?.addEventListener('click', () => {
    const steps = currentSequence().steps || [];
    if (!steps.length) return;
    state.playing = false;
    playBtn.textContent = '播放';
    state.stepIdx = (state.stepIdx + 1) % steps.length;
    state.progress = 0;
    refreshSceneVisuals();
  });
  speedBtn?.addEventListener('click', () => {
    state.speed = state.speed === 1 ? 2 : 1;
    speedBtn.textContent = `${state.speed}x`;
  });
  resetBtn?.addEventListener('click', () => {
    state.stepIdx = 0;
    state.progress = 0;
    state.selectedStationId = null;
    state.playing = state.mode === 'replay' || state.routeId !== 'overview';
    playBtn.textContent = state.playing ? '暂停' : '播放';
    renderDrawer();
    refreshSceneVisuals();
  });

  document.querySelectorAll('#wb-inv-pills [data-ikind]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.invKind = btn.getAttribute('data-ikind') || 'all';
      document.querySelectorAll('#wb-inv-pills [data-ikind]').forEach(b => b.classList.toggle('is-active', b.getAttribute('data-ikind') === state.invKind));
      renderInventory();
    });
  });

  let lastTs = 0;
  function animateFrame(ts) {
    if (!lastTs) lastTs = ts;
    const dtSec = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;

    const seqObj = currentSequence();
    const steps = seqObj.steps || [];
    if (steps.length) {
      if (state.playing) {
        state.progress += dtSec * 0.72 * state.speed;
        if (state.progress >= 1) {
          state.progress = 0;
          state.stepIdx = (state.stepIdx + 1) % steps.length;
          refreshSceneVisuals();
        }
      }
      const cur = steps[state.stepIdx % steps.length];
      const ep = cur.edge ? edgeSvgRefs.get(cur.edge) : null;
      const bob = state.playing ? Math.sin(ts / 140) * 1.8 : 0;
      if (ep && ep.getTotalLength) {
        const len = ep.getTotalLength();
        const pt = ep.getPointAtLength(len * Math.min(1, Math.max(0, state.progress)));
        mojoChefEl.setAttribute('transform', `translate(${pt.x.toFixed(1)}, ${(pt.y + bob).toFixed(1)})`);
        mojoChefEl.style.display = 'block';
      } else {
        const st = stationById.get(cur.station);
        if (st) {
          const cx = st.x + st.w * 0.5;
          const cy = st.y + st.h * 0.5 + bob;
          mojoChefEl.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);
          mojoChefEl.style.display = 'block';
        }
      }
    } else {
      mojoChefEl.style.display = 'none';
    }
    requestAnimationFrame(animateFrame);
  }

  buildBlueprintSvg();
  populateRouteAndRunControls();
  renderDrawer();
  renderInventory();
  refreshSceneVisuals();
  requestAnimationFrame(animateFrame);
})();
</script>
</body>
</html>
